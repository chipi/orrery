name: Set up Node
description: >-
  The repo's Node toolchain in one place: version and pinned setup-node.
  Every workflow uses this instead of its own actions/setup-node block, so a
  Node bump (like #598, 20 -> 22) is a one-line change. Install (npm ci and
  its flags) stays in each workflow. Needs actions/checkout first.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: 22
        cache: npm
