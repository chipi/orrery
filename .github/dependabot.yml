# Dependabot — npm + GitHub Actions
# Enabled per Slice 6 / Issue #6 deliverable. Weekly cadence keeps
# noise low; CI must pass before merging.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    # Pin tight per project convention — keep major bumps as separate
    # PRs that get explicit review (Three.js r128 lock per ADR-001
    # is not safe to bump unattended).
    versioning-strategy: increase-if-necessary
    # @sentry/capacitor pins the Sentry SDK to an exact version, so a lone
    # @sentry/sveltekit bump fails its postinstall sibling check.
    groups:
      sentry:
        patterns:
          - '@sentry/*'
    ignore:
      # SvelteKit's typescript peer range stops at ^6.
      - dependency-name: typescript
        versions: ['>=7']
      # @sentry/capacitor (latest 4.4.0) pins the SDK to exactly 10.69.0 and its
      # postinstall rejects 11.x (#571). Lift once a capacitor release supports 11.
      - dependency-name: '@sentry/*'
        versions: ['>=11']
      # sharp 0.35 adds @img/sharp-wasm32 (`Apache-2.0 AND LGPL-3.0-or-later AND MIT`),
      # which the Tech BOM gate rejects: it doesn't parse SPDX AND expressions and
      # classes it runtime (#573). Lift once scripts/build-tech-bom.ts handles both.
      - dependency-name: sharp
        versions: ['>=0.35']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    # init and analyze must run the same version.
    groups:
      codeql:
        patterns:
          - 'github/codeql-action*'
