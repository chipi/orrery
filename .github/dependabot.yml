# Dependabot — npm, GitHub Actions and Docker base images
# Enabled per Slice 6 / Issue #6 deliverable. Weekly cadence keeps
# noise low; CI must pass before merging.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    # Pin tight per project convention — keep major bumps as separate
    # PRs that get explicit review (Three.js r128 lock per ADR-001
    # is not safe to bump unattended).
    versioning-strategy: increase-if-necessary
    # @sentry/capacitor pins the Sentry SDK to an exact version, so a lone
    # @sentry/sveltekit bump fails its postinstall sibling check.
    groups:
      sentry:
        patterns:
          - '@sentry/*'
    ignore:
      # SvelteKit's typescript peer range stops at ^6.
      - dependency-name: typescript
        versions: ['>=7']
      # @sentry/capacitor (latest 4.4.0) pins the SDK to exactly 10.69.0 and its
      # postinstall rejects 11.x (#571). Lift once a capacitor release supports 11.
      - dependency-name: '@sentry/*'
        versions: ['>=11']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    # init and analyze must run the same version.
    groups:
      codeql:
        patterns:
          - 'github/codeql-action*'

  # Base images are digest-pinned (#599): Dockerfile, Dockerfile.lab-api and
  # Dockerfile.mcp at the root, the web tier in ops/docker. Dependabot bumps the
  # digest when the tag moves, so security rebuilds of node:22 / alpine:3.22
  # arrive as reviewable PRs instead of silently on the next build.
  - package-ecosystem: docker
    directories:
      - /
      - /ops/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    # The Node major is chosen deliberately (ADR-063/064 amendments, #598).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
