name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel earlier in-flight runs on the same ref when a newer push or
# PR update lands. Keeps the latest commit's status as the source of
# truth and prevents stale "cancelled" entries from polling the README
# badge. Per-PR runs cancel cleanly when a new commit pushes to the
# same PR; main runs cancel cleanly when fast-consecutive pushes land.
#
# Launches-bot pushes (`chore(launches): refresh — …`) land on a
# separate concurrency group so the launches cron NEVER cancels a
# user CI run in flight — that race bit the 2026-06-16 #342 cycle
# (my `fix(prod)` CI got cancelled mid-run when launches refreshed,
# and the docker-e2e → publish-platforms chain never ran on my
# commit, so the prod deploy then couldn't find the matching image
# tag). The separate group means launches refresh CI still runs to
# validate data, but in parallel with whatever user CI is happening.
concurrency:
  group: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(launches): refresh') && format('ci-launches-{0}', github.ref) || format('ci-{0}', github.ref) }}"
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fail merges on HIGH/CRITICAL prod-dep advisories. Scoped to
      # --omit=dev because dev-time advisories (esbuild dev-server CORS,
      # eslint plugin ReDoS) are tracked separately and would otherwise
      # block unrelated work. GH #265.
      #
      # Allowlisted advisories (re-evaluate when upstream ships a fix):
      #
      #   GHSA-gv7w-rqvm-qjhr — esbuild Deno-module binary integrity
      #     bypass via NPM_CONFIG_REGISTRY. Affects the Deno path only;
      #     orrery is a Node.js/Vite project (no Deno bundler use).
      #     Upstream fix is in esbuild 0.28.1+, but vite 5/6/7 pin
      #     esbuild 0.21-0.27 (newer break the chrome87 build target).
      #     Will lift the allowlist when vite ships with esbuild 0.28+.
      #
      #   GHSA-fx2h-pf6j-xcff — vite server.fs.deny bypass on Windows
      #     alternate paths. Patched range is `>6.4.2`, so vite 5.x is
      #     not patched and a major bump (5 → 6) breaks SvelteKit 2.61.
      #     Risk surface: dev-server only AND Windows-only. orrery is
      #     a Mac/Linux project building a static SPA — no dev server
      #     in production, no Windows hosts in our pipeline. Re-evaluate
      #     when SvelteKit ships a vite ≥6.4.3 compatible release.
      - name: npm audit (high+critical, prod deps only)
        run: |
          set -o pipefail
          # Capture audit JSON, then filter known-irrelevant advisories.
          # Exit 0 only if every remaining high/critical advisory has
          # been filtered. Anything else surfaces and fails the job.
          audit_json=$(npm audit --omit=dev --json 2>/dev/null || true)
          echo "$audit_json" | python3 -c "
          import json,sys
          d=json.loads(sys.stdin.read() or '{}')
          # NOTE: keep this block ASCII with NO backticks - it lives inside a
          # bash double-quoted string, so backticks would run as a subshell.
          ALLOWLIST={'GHSA-gv7w-rqvm-qjhr', 'GHSA-fx2h-pf6j-xcff'}
          bad=[]
          for name, info in d.get('vulnerabilities', {}).items():
              for via in info.get('via', []):
                  if not isinstance(via, dict): continue
                  sev=via.get('severity','')
                  if sev not in ('high','critical'): continue
                  url=via.get('url','')
                  gha=url.rsplit('/',1)[-1] if 'advisories' in url else ''
                  if gha in ALLOWLIST:
                      print(f'allowlisted: {name} ← {gha} ({sev})', file=sys.stderr)
                      continue
                  bad.append((name, gha, sev, via.get('title','')))
          if bad:
              print('high/critical advisories that need attention:')
              for n,g,s,t in bad:
                  print(f'  FAIL: {n} ← {g} ({s}) — {t}')
              sys.exit(1)
          print('audit gate: clean (or only allowlisted)')
          "
      - run: npm run typecheck
      # Type-check the build-time tools in scripts/ (tsconfig.scripts.json).
      # The main typecheck's include is src-focused, so scripts went
      # unchecked — tsx ran them without tsc. This gate closes that hole.
      - name: Typecheck — scripts/
        run: npm run typecheck:scripts
      # Split prettier + eslint into discrete steps with `if: always()` on
      # the second so a Prettier failure doesn't short-circuit ESLint —
      # both diagnostics surface in a single CI run, matching the
      # preflight rule (CLAUDE.md "Before pushing").
      - name: Lint — Prettier
        run: npm run lint:prettier
      - name: Lint — ESLint
        if: always()
        run: npm run lint:eslint
      # `test:coverage` runs the same vitest invocation as `test` with
      # `--coverage` added, which enforces the thresholds locked in
      # vite.config.ts (statements ≥ 92, branches ≥ 76, functions ≥ 86,
      # lines ≥ 94). One step covers both correctness AND coverage
      # gating; coverage instrumentation adds ~10 % to test wall time
      # which is negligible at our scale (~1 000 tests in ~1 s).
      #
      # Pre-push (`npm run preflight`) intentionally stays on `npm run
      # test` so local feedback stays fast. Locally, run
      # `npm run test:coverage` explicitly when you want to verify the
      # gate before pushing.
      - run: npm run test:coverage
      - run: npm run validate-data
      - run: npm run build
