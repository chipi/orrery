name: CodeQL

# Static-analysis gate (GH #269). Catches the XSS / open-redirect /
# unsafe-eval / prototype-pollution class at source — the same class as
# the SvelteKit `search_params` XSS that motivated the v0.7.0 security
# review (#96 → #264). Runs on push + PR + weekly schedule.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 6 * * 1' # Mondays 06:15 UTC — outside the launches-refresh window

# Avoid stacking analyses on rapid-fire pushes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds higher-precision queries (XSS via
          # tracked input, open-redirect via tainted URL params, etc.)
          # on top of the default suite.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          category: '/language:${{ matrix.language }}'
