name: Deploy docs

# GitHub Pages serves ONLY the project docs (2026-11 no-staging decision).
# The app ships to the self-hosted VPS (deploy-prod.yml) and is validated there
# (validate-prod.yml); there is no Pages preview of the app any more.
#
# Fires on CI success (ADR-070: docs correctness is independent of e2e state, so
# a mobile-only flake never holds a docs fix back). The published tree is
# replaced wholesale on every run:
#
#   gh-pages/index.html   — static forwarder to https://www.orrerylearn.com/
#                           (docs/.vitepress/gh-pages-root/index.html)
#   gh-pages/docs/        — the VitePress build, so /orrery/docs/ URLs keep working
#
# History: GH #260 follow-up. May 2026 Vue interpolation parse error in ADR docs
# blocked the app+docs publisher for hours behind unrelated mobile e2e
# regressions; the split in ADR-070 made docs deploy independent. The app half
# of the split is gone, the docs half stays.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One publisher at a time on gh-pages; a mid-publish is never aborted.
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires on every completion; only deploy on success.
    # Manual triggers always proceed.
    # Fork PRs: `branches: [main]` matches the triggering run's head_branch, which is
    # the FORK's branch name — a fork branch called `main` would pass, and the job
    # would then check out and run that fork's head_sha with this workflow's token and
    # secrets. Only accept CI runs that were a push to this repository (#593 H1).
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Deploy the exact SHA that passed CI (not the latest of main,
          # which may have moved on while CI ran).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: ./.github/actions/setup-node

      - run: npm ci

      # svelte.config.js imports `src/lib/paraglide/runtime.js`, which is
      # generated by paraglide on every dev/build but is NOT committed.
      # Without this step `svelte-kit sync` fails at
      # `Cannot find module '/.../src/lib/paraglide/runtime.js' imported
      # from /.../svelte.config.js`.
      - run: npm run i18n:compile

      # vitepress build resolves the root tsconfig.json which extends
      # ./.svelte-kit/tsconfig.json — that file is generated by
      # `svelte-kit sync` (run by `npm run typecheck` etc, but not by
      # `npm ci`). Without this step the build fails at
      # `[vite:esbuild] failed to resolve "extends":"./.svelte-kit/tsconfig.json"`.
      - run: npx svelte-kit sync

      - run: npm run docs:build
        env:
          DOCS_BASE: /orrery/docs/

      - name: Assemble the Pages tree (root forwarder + docs/)
        run: |
          mkdir -p pages
          cp docs/.vitepress/gh-pages-root/index.html pages/index.html
          cp -r docs/.vitepress/dist pages/docs

      - name: Publish to gh-pages (replaces the whole tree)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          commit_message: 'docs: deploy from ${{ github.event.workflow_run.head_sha || github.sha }} (CI-gated, no e2e dependency)'
