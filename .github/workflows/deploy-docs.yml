name: Deploy docs

# Docs-only deploy — fires on CI success regardless of e2e state.
#
# ADR-070: docs site correctness is independent of e2e regressions.
# Mobile-only flakes in the app's Playwright suite shouldn't block docs
# updates from publishing. This workflow + staging.yml split the
# previous monolithic deploy:
#
#   * deploy-docs.yml (this file) — fires on CI success, publishes only
#     build/docs/ to gh-pages with `keep_files: true` so the existing
#     app bundle stays intact.
#   * staging.yml — stays e2e-gated, publishes the full build/ (app +
#     docs together). Overwrites the docs subdir with whatever it built
#     (same docs content, since both use `npm run docs:build`).
#
# Shared concurrency group `gh-pages-publish` serializes both workflows
# on the gh-pages branch so they don't race.
#
# History: GH #260 follow-up. May 2026 Vue interpolation parse error in
# ADR docs blocked Deploy staging; that same chain stayed blocked for
# hours afterwards by unrelated mobile e2e regressions, with the docs
# fix already on main but invisible. This workflow makes docs deploy
# independent so future docs fixes ship as soon as CI is green.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize against staging.yml (the app+docs publisher) so two
  # workflows don't race on the gh-pages branch.
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires on every completion; only deploy on success.
    # Manual triggers always proceed.
    # Fork PRs: `branches: [main]` matches the triggering run's head_branch, which is
    # the FORK's branch name — a fork branch called `main` would pass, and the job
    # would then check out and run that fork's head_sha with this workflow's token and
    # secrets. Only accept CI runs that were a push to this repository (#593 H1).
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Deploy the exact SHA that passed CI (not the latest of main,
          # which may have moved on while CI ran).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # svelte.config.js imports `src/lib/paraglide/runtime.js`, which is
      # generated by paraglide on every dev/build but is NOT committed.
      # Without this step `svelte-kit sync` fails at
      # `Cannot find module '/.../src/lib/paraglide/runtime.js' imported
      # from /.../svelte.config.js`.
      - run: npm run i18n:compile

      # vitepress build resolves the root tsconfig.json which extends
      # ./.svelte-kit/tsconfig.json — that file is generated by
      # `svelte-kit sync` (run by `npm run typecheck` etc, but not by
      # `npm ci`). Without this step the build fails at
      # `[vite:esbuild] failed to resolve "extends":"./.svelte-kit/tsconfig.json"`.
      - run: npx svelte-kit sync

      - run: npm run docs:build
        env:
          DOCS_BASE: /orrery/docs/

      - name: Publish docs subdir only (keep_files preserves app bundle)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist
          publish_branch: gh-pages
          # CRITICAL: keep_files: true so this deploy doesn't wipe the
          # app bundle that staging.yml previously published. With this
          # flag the deploy is overlay-style — only files inside
          # destination_dir get touched.
          destination_dir: docs
          keep_files: true
          commit_message: 'docs: deploy from ${{ github.event.workflow_run.head_sha || github.sha }} (CI-gated, no e2e dependency)'
