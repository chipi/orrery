name: Deploy to prod VPS (orrery)

# GH #260 phase 1 (tailnet-only) + #261 thin-deploy pivot. Deploys
# orrery to the Hetzner VPS that also hosts podcast_scraper, via
# Tailscale SSH.
#
# Ownership split (mirrors podcast_scraper exactly — see #261):
#   - **Bootstrap** (creating /srv/orrery as deploy-owned, initial
#     git clone) lives in podcast_scraper's cloud-init, runs as root
#     at VPS first-boot. NOT in this workflow.
#   - **Deploy** (this workflow) assumes /srv/orrery already exists
#     as a deploy@-owned git checkout. It just `git fetch+reset`s
#     and `docker compose`s. Runs as `deploy`, idempotent.
#   - **Static-bundle delivery** stays in this workflow (rsync
#     build/ to VPS) — per ADR-063 the web container is stock
#     nginx:alpine + bind-mount of build/, and CI is the only place
#     Node runs.
#
# Manual-trigger only at first land. After the operator's first
# few green manual runs, add the `workflow_run: [docker-e2e]`
# trigger to complete the GitOps deploy loop. Until then,
# `workflow_dispatch` is the only entry.
#
# Operator prerequisites (set on the canonical repo, settings →
# environments → prod → secrets/vars):
#   - secrets.TS_OAUTH_CLIENT_ID       — Tailscale OAuth client (shared chipi
#   - secrets.TS_OAUTH_SECRET            deployer identity; scoped to tag:gha-deployer).
#                                        Does not expire like an auth key.
#   - secrets.PROD_SSH_PRIVATE_KEY     — Ed25519 PEM for deploy@
#                                        user on the VPS
#   - vars.PROD_SSH_HOST_KEY          — the VPS ed25519 host key, pinned (#600)
#   - vars.PROD_TAILNET_FQDN          — e.g.
#                                        "orrery-prod.<tailnet>.ts.net"
#                                        (the host orrery shares
#                                        with podcast_scraper)
#
# VPS prerequisites (one-time, owned by podcast_scraper cloud-init —
# see docs/ops/deploy-prod-vps.md §"VPS prerequisites"):
#   - /srv/orrery/ exists as a deploy:deploy-owned git checkout
#   - deploy@ user can `docker compose ...` in /srv/orrery/
#   - The orrery deploy pubkey is in deploy@'s authorized_keys

on:
  workflow_dispatch:
    inputs:
      override_image_sha:
        description: "Image :sha-<7> tag to deploy (blank = current main HEAD short SHA)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  # Serialize prod deploys. Don't cancel-in-progress; cancelling mid
  # `compose up` leaves the stack in an unknown state.
  group: deploy-prod-orrery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 30 (was 15): actions/checkout is intermittently slow on this repo —
    # the shallow `git fetch` stalls in negotiation (no transfer progress)
    # for 12–18 min on some runner/network draws, fast (<1 min) on others,
    # all on the same commit (observed across CI/e2e jobs 2026-07-29). This
    # single-job workflow only gets one checkout roll, so a 15-min budget
    # was killed twice before the build could finish. 30 min absorbs a slow
    # checkout and still leaves room for npm ci + build (~6 min) + deploy.
    timeout-minutes: 30
    # Bind to the `prod` environment so this job can see the
    # environment-scoped secrets (TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET, PROD_SSH_PRIVATE_KEY) +
    # variables (PROD_TAILNET_FQDN) staged in repo settings →
    # Environments → prod. Environment binding also enables protection
    # rules (required reviewers, deployment-branch policies) if you
    # want them later — settings → environments → prod → protection.
    environment: prod
    # Main only (#593 H2): a dispatch from another ref would rsync a branch-built bundle
    # on top of main's server code (the VPS resets to origin/main). This line stops the
    # accidental case; the `prod` environment's deployment-branch policy is what stops
    # a branch that edits this file.
    if: github.ref == 'refs/heads/main'
    outputs:
      # Surfaced so the post-deploy `validate` job can skip when the deploy
      # itself no-op'd (missing prereqs → nothing new was published).
      skipped: ${{ steps.preflight.outputs.skip }}
    steps:
      - name: Pre-flight — required secrets/variables present?
        id: preflight
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_OAUTH_CLIENT_ID:-}" ]    && MISSING="$MISSING TS_OAUTH_CLIENT_ID"
          [ -z "${TS_OAUTH_SECRET:-}" ]       && MISSING="$MISSING TS_OAUTH_SECRET"
          [ -z "${PROD_SSH_PRIVATE_KEY:-}" ]  && MISSING="$MISSING PROD_SSH_PRIVATE_KEY"
          [ -z "${PROD_TAILNET_FQDN:-}" ]     && MISSING="$MISSING PROD_TAILNET_FQDN"
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing prereqs:$MISSING"
            echo "::warning::Stage them per docs/ops/deploy-prod-vps.md then re-run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: steps.preflight.outputs.skip != 'true'
        with:
          fetch-depth: 1

      - name: Resolve target image tag
        # One tag drives the mcp, lab-api AND pipeline-runner images (written to .env
        # below). It is the deployed commit's `sha-<7>` (#599): `:main` meant a deploy of
        # commit X ran whatever backend image happened to be newest, possibly from a later
        # commit or one whose e2e failed. ci.yml (mcp/lab-api, after green unit) and
        # docker-e2e.yml (pipeline-runner, after green e2e) publish `sha-<7>` on every main
        # push; the next step refuses the deploy when any of the three is missing.
        # `override_image_sha` deploys an earlier commit's images (rollback).
        id: sha
        if: steps.preflight.outputs.skip != 'true'
        # Dispatch input via env, never interpolated into the script (#600); it also
        # lands in .env as the image tag, so only a hex sha is accepted.
        env:
          OVERRIDE: ${{ github.event.inputs.override_image_sha }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ] && ! [[ "$OVERRIDE" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::override_image_sha must be 7-40 lowercase hex chars"
            exit 1
          fi
          # Published tags carry 7 hex chars; a longer override is cut to match.
          if [ -n "$OVERRIDE" ]; then
            TAG="sha-${OVERRIDE:0:7}"
          else
            TAG="sha-${GITHUB_SHA:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # `short` output preserved for the Sentry release labelling
          # downstream — Sentry wants HEAD's actual commit SHA on the
          # release, not the image tag (the deployed code is HEAD; the
          # pipeline-runner image is independent). A fixed 8 hex, the same as
          # staging.yml, so one commit has one release name in every tier;
          # `git rev-parse --short` varies its length with the clone.
          echo "short=$(git rev-parse HEAD | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying with ORRERY_PIPELINE_IMAGE_TAG=$TAG"

      - name: Refuse a tag GHCR does not have
        # Fail here, before anything touches the box, rather than at `compose pull`
        # halfway through the deploy. The packages are public: an anonymous pull token
        # is enough to read a manifest.
        if: steps.preflight.outputs.skip != 'true'
        env:
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          set -euo pipefail
          missing=""
          for img in orrery-mcp orrery-lab-api orrery-pipeline-runner; do
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:chipi/${img}:pull" | sed -E 's/.*"token":"([^"]+)".*/\1/')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/chipi/${img}/manifests/${TAG}")
            echo "${img}:${TAG} -> HTTP ${code}"
            [ "$code" = "200" ] || missing="$missing ${img}:${TAG}"
          done
          if [ -n "$missing" ]; then
            echo "::error::not on GHCR:${missing} — CI has not published this commit's images (ci.yml image jobs, docker-e2e publish). Deploy a commit whose images exist, or pass override_image_sha."
            exit 1
          fi

      - name: Setup Node 22 (build static bundle for deploy)
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.preflight.outputs.skip != 'true'

      - name: Build static bundle (the deploy unit)
        # Per ADR-063 the web container is stock nginx:alpine + bind-mount.
        # The static bundle is the deploy artefact. CI builds it; VPS
        # rsyncs it. VPS does not need Node installed.
        #
        # PUBLIC_SENTRY_* env (ADR-067, #263): vite/SvelteKit bakes
        # these into the static bundle at build time. PUBLIC_ prefix
        # means $env/dynamic/public exposes them client-side.
        # Empty DSN → initSentry() returns immediately, no SDK init,
        # no outbound traffic (fork-silent default).
        if: steps.preflight.outputs.skip != 'true'
        env:
          # PUBLIC_SENTRY_DSN → self-hosted GlitchTip project 18 (orrery-prod) via
          # the public ingest-only vhost (https://glitchtip.<domain>/18). Empty until the
          # edge vhost is live — a not-yet-live DSN silently drops events, so
          # keep the secret unset until podcast-infra confirms Phase 5.5 is up.
          # The key is public (ships in the bundle); it stays a secret only to
          # keep the repo clean. Browser-only; never point at the tailnet
          # homelab:8090 (unreachable for public users).
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          # env label aligned with the o11y estate (dev / staging / prod).
          PUBLIC_SENTRY_ENVIRONMENT: prod
          PUBLIC_SENTRY_RELEASE: gha-${{ steps.sha.outputs.short }}
          # Self-hosted Umami — mirrors the Sentry wiring above exactly: the
          # fixed edge host is hardcoded here (like PUBLIC_SENTRY_ENVIRONMENT),
          # and the only operator-set value is the website id, kept in a secret
          # like PUBLIC_SENTRY_DSN (it's public — ships in the bundle — but the
          # secret keeps it out of the repo). src/lib/analytics.ts stays silent
          # until the id secret is set, so an empty value is safe. Set it to the
          # id of the Orrery website registered in the self-hosted Umami admin.
          PUBLIC_UMAMI_HOST: https://analytics.orrerylearn.com
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}
          # Source maps (#595): hidden maps (no sourceMappingURL), packaged below.
          SENTRY_SOURCEMAPS: '1'
        run: |
          set -euo pipefail
          npm run build
          # Debug ids were injected during the build (sentryVitePlugin). Pair them into
          # the artifact's js/map copies, move the maps out of build/; served files
          # are left exactly as built.
          node scripts/sourcemaps/package.mjs build sourcemaps-out
          # Never publish source maps: the bundle is served as-is from build/.
          LEFT=$(find build -name '*.map' -o -name '*.map.br' -o -name '*.map.gz' | wc -l)
          if [ "$LEFT" -ne 0 ]; then
            echo "::error::$LEFT source-map files left in build/ — refusing to deploy them"
            exit 1
          fi

      - name: Source maps artifact for GlitchTip
        # #595 option (c): the homelab mini (agentic-ai-homelab
        # infra/glitchtip/upload-sourcemaps.py, every 15 min) downloads this artifact
        # from SUCCESSFUL deploy-prod runs and uploads it to GlitchTip orrery-prod.
        # The name must be sourcemaps-<the exact release the web SDK sends>, i.e.
        # PUBLIC_SENTRY_RELEASE above. No GlitchTip token lives in GitHub.
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sourcemaps-gha-${{ steps.sha.outputs.short }}
          path: sourcemaps-out/
          if-no-files-found: error
          retention-days: 14

      - name: Join the tailnet
        if: steps.preflight.outputs.skip != 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          # OAuth client (shared chipi deployer identity, same as podcast_scraper) — does not
          # expire like an auth key did (2026-08-02: the old TS_AUTHKEY lapsed and blocked prod
          # deploys). Reuses the same tailnet + tag:gha-deployer + target box.
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          # Pin to a known-good version. `latest` has broken sha256
          # verification in GHA before (podcast_scraper RFC-082).
          version: 1.96.4

      - name: Install SSH identity for deploy@
        # PEM private keys need a trailing newline or libcrypto rejects
        # them ("error in libcrypto"). GH UI sometimes strips the
        # trailing newline when secrets are pasted via the web form,
        # so we explicitly append one with printf and verify the key
        # is loadable with ssh-keygen before continuing.
        if: steps.preflight.outputs.skip != 'true'
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_HOST_KEY: ${{ vars.PROD_SSH_HOST_KEY }}
          PROD_TAILNET_FQDN_PIN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::PROD_SSH_PRIVATE_KEY is not a loadable OpenSSH/PEM private key."
            echo "::error::Common causes: wrong format (PuTTY .ppk), encrypted key, or"
            echo "::error::corrupted paste. Regenerate the key as ed25519 PEM and re-paste"
            echo "::error::INCLUDING the -----BEGIN OPENSSH PRIVATE KEY----- header and"
            echo "::error::-----END OPENSSH PRIVATE KEY----- footer."
            exit 1
          fi
          # Pinned host key (#600): a TOFU keyscan would trust whatever answers.
          # PROD_SSH_HOST_KEY is the box's ed25519 public key ("ssh-ed25519 AAAA…"),
          # SHA256:jcRHkLFcNnL122wb3nM7F5nNjEqCtyjfys6+sRJ1EA0 as of the 2026-05-29
          # build. A VPS rebuild generates new host keys: re-pin per
          # docs/ops/deploy-prod-vps.md §"Re-pin the SSH host key".
          if [ -z "${PROD_SSH_HOST_KEY:-}" ]; then
            echo "::error::vars.PROD_SSH_HOST_KEY (prod environment) is not set."
            exit 1
          fi
          printf '%s %s\n' "${PROD_TAILNET_FQDN_PIN}" "${PROD_SSH_HOST_KEY}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync static bundle to VPS
        # ADR-063: web container is stock nginx:alpine + bind-mount of
        # ./build. CI builds, VPS rsyncs.
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            build/ "${SSH_TARGET}:/srv/orrery/build/"

      - name: Seed the /data overlay on the VPS with the built data
        # nginx serves `/data/` from the `./static/data` bind-mount overlay
        # (ADR-065), NOT from build/ — so the cron pipeline can write live data
        # (launches, TLEs) that nginx serves without a rebuild. But the overlay
        # dir also needs the GENERATED, git-IGNORED bundles the build produces —
        # `static/data/i18n/` (per-locale i18n bundles from build-i18n-bundles.mjs).
        # `git reset --hard` on the VPS only restores TRACKED files, so those
        # bundles never arrived → every /data/i18n/*.json 404'd → programs pages
        # + /explore overlays failed ("Missing overlay, no en-US fallback"), while
        # GH Pages (which serves build/data/ directly, no overlay) worked. Fix:
        # deliver the built data/ into the host's static/data/ so the overlay is
        # complete. NO --delete — this dir is shared with the cron pipeline's live
        # writes, so the seed is additive; build/data is identical to static/data
        # post-build, so tracked files are just re-confirmed.
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            build/data/ "${SSH_TARGET}:/srv/orrery/static/data/"

      - name: Stage /srv/orrery/.env from GH Secrets (#263)
        # Mirror of podcast_scraper deploy.yml lines 147-218. Renders
        # the host-side .env from `prod`-scoped GH secrets every deploy.
        # GH Secrets is the source of truth; .env is a transient artifact
        # regenerated on every run. Missing secrets → empty values →
        # compose's `${VAR:-}` defaults take over → integration silently
        # off, stack still starts.
        #
        # Atomic delivery: tmpfile in /dev/shm (RAM-backed, never on
        # disk), trap shred-on-exit, SCP to .env.deploy-staged on host,
        # then atomic ssh `mv .env.deploy-staged .env` so the host
        # never sees a partial file. `printf '%s=%s\n'` keeps values
        # shell-safe (no interpolation of secret content).
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
          IMAGE_TAG: ${{ steps.sha.outputs.tag }}
          # Backend auth secrets (D/E · #464). Empty when unset → deploy_stack.sh
          # brings up web-only + a warning (lab-api crash-loops without them).
          LAB_GOOGLE_CLIENT_ID: ${{ secrets.ORRERY_LAB_GOOGLE_CLIENT_ID }}
          LAB_GOOGLE_CLIENT_SECRET: ${{ secrets.ORRERY_LAB_GOOGLE_CLIENT_SECRET }}
          LAB_CLAUDE_CLIENT_SECRET: ${{ secrets.ORRERY_LAB_CLAUDE_CLIENT_SECRET }}
          LITELLM_API_KEY: ${{ secrets.ORRERY_LITELLM_API_KEY }}
          # Server error tracking (ADR-094): GlitchTip projects 31 orrery-lab-api and
          # 32 orrery-mcp. Client keys, public by design; secrets only keep them out of
          # the repo (same as PUBLIC_SENTRY_DSN). Empty → that service sends no errors.
          LAB_API_SENTRY_DSN: ${{ secrets.ORRERY_LAB_API_SENTRY_DSN }}
          MCP_SENTRY_DSN: ${{ secrets.ORRERY_MCP_SENTRY_DSN }}
          UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}
        run: |
          set -euo pipefail
          # Logs now ship via the shared node Alloy (ADR-121; ops/observability/
          # orrery.alloy dropped into the box's config.d/). Orrery no longer runs
          # its own agent, so no Loki URL / homelab-IP is staged here.
          ENVTMP=$(mktemp -p /dev/shm orrery-env.XXXXXX)
          trap 'shred -u "$ENVTMP" 2>/dev/null || rm -f "$ENVTMP"' EXIT
          chmod 600 "$ENVTMP"
          {
            # Co-tenancy + per-deploy
            printf '%s=%s\n' COMPOSE_PROJECT_NAME      orrery
            printf '%s=%s\n' ORRERY_PORT               8090
            printf '%s=%s\n' ORRERY_PIPELINE_IMAGE_TAG "$IMAGE_TAG"
            # Backend images roll forward/back with the deploy tag (main | sha-<7>).
            printf '%s=%s\n' ORRERY_MCP_IMAGE_TAG      "$IMAGE_TAG"
            printf '%s=%s\n' ORRERY_LAB_API_IMAGE_TAG  "$IMAGE_TAG"
            # lab-api auth secrets — empty → web-only bring-up (deploy_stack.sh gate).
            printf '%s=%s\n' ORRERY_LAB_GOOGLE_CLIENT_ID     "$LAB_GOOGLE_CLIENT_ID"
            printf '%s=%s\n' ORRERY_LAB_GOOGLE_CLIENT_SECRET "$LAB_GOOGLE_CLIENT_SECRET"
            printf '%s=%s\n' ORRERY_LAB_CLAUDE_CLIENT_SECRET "$LAB_CLAUDE_CLIENT_SECRET"
            printf '%s=%s\n' ORRERY_LITELLM_API_KEY          "$LITELLM_API_KEY"
            # Public app origins — CORS + OAuth redirects. Apex + www + Pages
            # (www is a live origin; Fable-5 M2). Not secret.
            # LiteLLM gateway: lab-api is a BRIDGE container, so host.docker.internal
            # (→ docker bridge gateway) can't reach the gateway's 127.0.0.1:4001 bind.
            # Use the box's tailnet IP, where the gateway also binds (prod-podcast
            # 100.124.111.115:4001, verified reachable). #464 deploy-day fix.
            printf '%s=%s\n' ORRERY_LITELLM_BASE_URL 'http://100.124.111.115:4001'
            printf '%s=%s\n' ORRERY_LAB_CORS_ORIGINS 'https://orrerylearn.com,https://www.orrerylearn.com,https://chipi.github.io'
            printf '%s=%s\n' ORRERY_LAB_WEB_REDIRECT_URIS 'https://orrerylearn.com/lab/callback,https://www.orrerylearn.com/lab/callback,https://chipi.github.io/orrery/lab/callback'
            # Server observability (ADR-094). Release follows homelab ADR-0010
            # (`sha-<7>`, the same value as traces' service.version).
            printf '%s=%s\n' ORRERY_RELEASE            "sha-${GITHUB_SHA::7}"
            printf '%s=%s\n' ORRERY_LAB_API_SENTRY_DSN "$LAB_API_SENTRY_DSN"
            printf '%s=%s\n' ORRERY_MCP_SENTRY_DSN     "$MCP_SENTRY_DSN"
            # VictoriaTraces on the homelab, over the tailnet (the endpoint podcast's
            # player-api uses; reachable from the orrery containers, checked 2026-10-16).
            printf '%s=%s\n' ORRERY_OTLP_TRACES_ENDPOINT 'https://vtraces.tail6d0ed4.ts.net/insert/opentelemetry/v1/traces'
            printf '%s=%s\n' ORRERY_UMAMI_HOST         'https://analytics.orrerylearn.com'
            printf '%s=%s\n' ORRERY_UMAMI_WEBSITE_ID   "$UMAMI_WEBSITE_ID"
          } > "$ENVTMP"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$ENVTMP" "${SSH_TARGET}:/srv/orrery/.env.deploy-staged"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; cd /srv/orrery; \
             mv .env.deploy-staged .env; chmod 600 .env"

      - name: Deploy (fetch + reset + whole-stack up + healthcheck)
        # Mirror of podcast_scraper's deploy.sh — thin, idempotent,
        # zero-bootstrap. This step only does the git sync; the rest lives in
        # ops/deploy_stack.sh (run from the FRESH checkout) because the gated
        # whole-stack bring-up + lab-api state bootstrap + per-service
        # healthchecks outgrew a safely-escaped inline ssh string (Fable-5).
        # deploy_stack.sh: drops orrery.alloy into the shared node + HUPs it
        # (ADR-121), builds web, bootstraps lab-api-state, and brings up
        # web ALWAYS + mcp/lab-api ONLY when their secrets are staged (else
        # web-only + a warning — lab-api crash-loops without them). Caddy
        # routing is the separate step below.
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; cd /srv/orrery; \
             git fetch --depth=50 origin '+refs/heads/main:refs/remotes/origin/main'; \
             git reset --hard origin/main; \
             bash ops/deploy_stack.sh"

      - name: Deploy orrery Caddy routing (own the vhosts — ADR-114 tenant ownership)
        # Orrery owns its three public vhosts (orrerylearn.com, telemetry.*, analytics.*).
        # The shared Caddy edge ENGINE stays podcast_scraper's (ADR-114): the base Caddyfile
        # `import`s /etc/caddy/sites/*.caddy, and deploy@ already owns that dir + has the
        # `systemctl reload|restart caddy` sudoers grant — no new box grant. The "Deploy" step
        # above just `git reset`ed /srv/orrery, so ops/caddy/*.caddy is current on the box; the
        # script installs them, `caddy adapt`-gates the merged config (adapt, not validate:
        # validate opens caddy's root-owned logs and fails as deploy@), and RELOADS caddy only
        # if valid and changed (graceful through the base Caddyfile's admin socket — a restart
        # took every tenant on the edge down for seconds; restart only if the reload is
        # refused; rollback otherwise — caddy never loads a broken config).
        # Runs after web is up so orrery.caddy's 127.0.0.1:8090 upstream is live.
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          # The telemetry/analytics vhosts proxy to the caddy-tailscale TLS nodes
          # (glitchtip.<tailnet> / umami.<tailnet>) and carry a __TAILNET__ placeholder —
          # the tailnet is never hardcoded in-repo (operator-identifier deny-list gate).
          # Derive it here (everything after the first label of PROD_TAILNET_FQDN) and
          # sed it into the box checkout before deploy_caddy_vhosts.sh installs the vhosts.
          TAILNET="${PROD_TAILNET_FQDN#*.}"
          [ -n "$TAILNET" ] && [ "$TAILNET" != "$PROD_TAILNET_FQDN" ] \
            || { echo "::error::could not derive TAILNET from PROD_TAILNET_FQDN='$PROD_TAILNET_FQDN'"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; cd /srv/orrery; \
             sed -i 's/__TAILNET__/${TAILNET}/g' ops/caddy/orrery-telemetry.caddy ops/caddy/orrery-analytics.caddy; \
             if grep -l __TAILNET__ ops/caddy/orrery-telemetry.caddy ops/caddy/orrery-analytics.caddy; then \
               echo '::error::__TAILNET__ placeholder unresolved after sed'; exit 1; fi; \
             bash ops/deploy_caddy_vhosts.sh"

      - name: Prime + schedule the on-VPS launch-data refresh (RFC-035)
        # Prod serves the launch manifest live from the /data overlay, but only
        # updates it on a (manual) deploy. Run the fetch once now so this deploy
        # ships current data, then install an idempotent deploy@ crontab so the
        # VPS keeps fetching from the upstream sources every 6h — no redeploy, no
        # GitHub. Non-fatal: a failure here doesn't fail the deploy (the site is
        # already up); the log shows what happened.
        if: steps.preflight.outputs.skip != 'true'
        continue-on-error: true
        env:
          SSH_TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET" \
            'set -euo pipefail; cd /srv/orrery; \
             bash ops/refresh-prod-data.sh; \
             CRON="0 */6 * * * /usr/bin/env bash /srv/orrery/ops/refresh-prod-data.sh >> /srv/orrery/data-refresh.log 2>&1"; \
             ( crontab -l 2>/dev/null | grep -vF refresh-prod-data.sh || true; echo "$CRON" ) | crontab -; \
             if crontab -l | grep -qF refresh-prod-data.sh; then echo "cron installed:"; crontab -l | grep -F refresh-prod-data.sh; else echo "WARN: cron not installed"; fi'

      - name: Re-arm tailscale serve via root-owned wrapper (NOPASSWD sudo)
        # Mirrors podcast_scraper/infra/deploy/deploy.sh:131-144 exactly.
        # Calls the cloud-init-installed wrapper at
        # /usr/local/sbin/orrery-tailscale-serve.sh, which is the only
        # tailscale-serve command `deploy@` is allowed to invoke
        # (per the narrow /etc/sudoers.d/99-orrery-deploy-tailscale-serve
        # allowlist provisioned in podcast_scraper#838).
        #
        # The wrapper is the durability source of truth — it's also
        # invoked by cloud-init runcmd at first boot, so the serve
        # registration survives VPS rebuilds even if no deploy has
        # happened. This step is the deploy-time repair path.
        #
        # 3-attempt retry, WARN on final failure, does NOT fail the
        # deploy. The External health probe step that follows is the
        # actual end-to-end check.
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; \
             ts_ok=0; \
             for a in 1 2 3; do \
               if sudo -n /usr/local/sbin/orrery-tailscale-serve.sh; then \
                 ts_ok=1; break; \
               fi; \
               echo \"[\$(date -u +%FT%TZ)] orrery-tailscale-serve.sh attempt \$a failed; retrying in 5s...\" >&2; \
               sleep 5; \
             done; \
             if [ \"\$ts_ok\" != 1 ]; then \
               echo 'WARNING: orrery-tailscale-serve.sh failed after 3 attempts (tailnet :8443 may be down). Deploy continues; fix script on host or reprovision cloud-init.' >&2; \
             fi; \
             tailscale serve status"

      - name: External health probe over Tailscale
        # Belt-and-suspenders: the deploy step already hit GET / on the
        # VPS's :ORRERY_PORT loopback. This probes via tailnet MagicDNS
        # so `tailscale serve` is also validated end-to-end.
        # 60s timeout (12 × 5s).
        if: steps.preflight.outputs.skip != 'true'
        env:
          PROBE_URL: https://${{ vars.PROD_TAILNET_FQDN }}:8443/
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null "$PROBE_URL"; then
              echo "::notice::tailnet probe OK after $((i * 5))s — orrery is live at $PROBE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::tailnet probe did not succeed within 60s at $PROBE_URL"
          exit 1

  # ── Post-deploy validation ────────────────────────────────────────────────
  # Runs `npm run validate-prod` (scripts/validate-prod.mjs) against the PUBLIC
  # URL from a GH runner over the open internet — exercises the full public
  # serving path (nginx CSP + headers, the /data overlay, the service worker,
  # every route in all 13 locales, the telemetry-config regression guards) that
  # the tailnet health probes above cannot see. A red run here means "deployed
  # but the public site is broken" — the exact class of bug that hid behind
  # green edge checks on 2026-07-22.
  #
  # No VALIDATE_ERROR_POST → the error-monitoring guard does config-only checks
  # (DSN baked + dashless key + CSP connect-src); it does NOT fire a synthetic
  # error, so this never pollutes GlitchTip project 18 (orrery-prod) on every deploy.
  validate:
    needs: deploy
    if: needs.deploy.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate the live public deployment
        env:
          VALIDATE_URL: ${{ vars.PROD_PUBLIC_URL || 'https://www.orrerylearn.com' }}
        run: npm run validate-prod
