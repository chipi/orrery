name: docker-e2e

# Canonical Playwright gate (ADR-071). Stands up the docker-compose
# stack inside the GH Actions runner and runs the full Playwright suite
# against the live nginx-served bundle. Asserts the production-shape
# serving contract: cache headers, CSP, brotli + gzip negotiation, the
# /data volume overlay, and the SPA fallback via try_files.
#
# Triggers (per ADR-071, superseding ADR-066's push:main + path-gated PR):
#   1. After CI succeeds on main — workflow_run gate. CI is fast
#      (~2-3 min); docker-e2e is heavy (~17-25 min). Chaining means a
#      cheap typecheck/lint/unit-test failure short-circuits the heavy
#      docker build + Playwright run, and the downstream staging.yml
#      deploys only when both CI and docker-e2e are green.
#   2. Manual workflow_dispatch — ad-hoc reruns.
#   3. Nightly cron — catches EXTERNAL state drift (CDN outages,
#      upstream asset URL changes, Wikimedia rate-limit issues) that
#      isn't tied to a code push. Time chosen to land before EU devs
#      start the day (05:07 UTC = 06:07 CET = 22:07 PST), with the
#      off-minute (:07) to dodge GitHub Actions' top-of-hour scheduler
#      contention. Inherited from the deleted e2e.yml.
#
# On green main push, the `publish` job builds + pushes the
# `orrery-pipeline-runner` image to GHCR as multi-arch (amd64 + arm64).
# Pattern adapted from podcast_scraper's stack-test.yml (RFC-081 §Layer 1).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 5 * * *'

# When a newer push to main lands while an earlier docker-e2e is still
# running, cancel the older run rather than letting it complete after
# the new code is already on main. Without this, fast-consecutive
# pushes leave a string of "cancelled" runs as the latest workflow
# status, which renders as a red/grey badge on the README even though
# every commit eventually passes. Pre-empting cleanly keeps the badge
# accurate.
concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-e2e:
    # Matrix: desktop is sharded across 2 parallel legs, mobile across 4,
    # via Playwright's `--shard=N/M` (GH #277 / W7).
    #
    # Sharding history:
    #   - Originally desktop + mobile each ran as a single matrix entry
    #     (CI 2x desktop-only, no shards). On `--workers=1` (mandatory
    #     because the vite preview server can't handle parallel workers
    #     against the same docker-nginx stack), mobile-chromium hit 26+
    #     min Playwright runtime — within 2 min of the 30-min cap.
    #   - Run 26622390344 (May 2026): 28m01s success. Subsequent runs
    #     touched 30m15s — timeout-cancelled by 15 sec. 61b865a6d bumped
    #     the cap to 45 min to give comfortable headroom without masking
    #     real test slowness.
    #   - W7 finding (issue #277): /moon route specs dominate the slow
    #     tail (15 of the top 15 slowest specs are on /moon or
    #     /library); 6 Apollo hotspot tests alone cost ~125s serial.
    #     Sharding splits the 370 specs across N matrix legs running in
    #     parallel — Playwright distributes tests across shards by file
    #     count.
    #
    # Desktop was originally unsharded (17-19 min). Sharded into 2 on
    # 2026-07-15 after a recurring cancellation pattern: under runner
    # contention the single desktop leg would queue 60-90 min, and any
    # `chore(launches): refresh` landing in that window entered this
    # workflow's `concurrency` group and `cancel-in-progress` killed the
    # in-flight run — the cancellation fires at the WORKFLOW level, before
    # the job-level `if:` skip for refresh commits gets a chance to no-op
    # the leg. Two ~9-min desktop legs shrink the exposure window (and the
    # queue-then-cancel odds) roughly in half, mirroring the mobile split.
    #
    # Shard count = 4 (was 2, 2026-06-24): the touch-emulation overhead
    # on mobile-chromium (synthetic pointerdown/pointerup per click + a
    # long tail of /fly-related flakiness on scrub-by-touch UX that we
    # now skip explicitly per-spec) pushed mobile-1-of-2 close to the
    # 45 min job-timeout on every run, eventually cancelling. Per-leg
    # overhead (checkout + setup-node + npm ci + build + docker up +
    # playwright install) is ~1.7 min; at 4 shards each leg's Playwright
    # runtime drops to ~10-12 min, comfortably under timeout. Public
    # repo → unlimited Actions minutes, 20 concurrent runners; the
    # extra 2 setup overheads (now 4 mobile + 1 desktop = 5 vs. 3) are
    # free in $.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            shard: '1/2'
            shard_id: '1-of-2'
          - project: desktop-chromium
            shard: '2/2'
            shard_id: '2-of-2'
          - project: mobile-chromium
            shard: '1/4'
            shard_id: '1-of-4'
          - project: mobile-chromium
            shard: '2/4'
            shard_id: '2-of-4'
          - project: mobile-chromium
            shard: '3/4'
            shard_id: '3-of-4'
          - project: mobile-chromium
            shard: '4/4'
            shard_id: '4-of-4'
          # Landscape phone (Pixel 5 rotated). Guards the 0.7.2 responsive
          # redesign — touch chrome / drawers, not the desktop HUD columns. 2
          # shards: the heavy /fly render-validation + explore-perf specs are
          # desktop-only (skipped here), so landscape's tail is short.
          - project: mobile-landscape-chromium
            shard: '1/2'
            shard_id: '1-of-2'
          - project: mobile-landscape-chromium
            shard: '2/2'
            shard_id: '2-of-2'
    name: docker-e2e (${{ matrix.project }} ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    # workflow_run fires on EVERY completion of the upstream workflow
    # (success + failure + cancelled). Skip the run unless CI passed,
    # so a typecheck/lint/unit-test failure doesn't waste 17-25 min of
    # docker-e2e runtime. Manual + cron triggers always proceed.
    #
    # Also skip workflow_run triggered by bot-pushed data refresh
    # commits — launches-refresh + snapshot-regen don't change any
    # code that affects e2e, but they fire CI which fires this. The
    # cancel-in-progress concurrency rule + the next "real" push
    # would then cancel each other in a cascade (observed
    # 2026-06-06: 4 cancelled docker-e2e runs in 12 hours). Cron +
    # workflow_dispatch still cover these commits on the daily 5 am
    # schedule.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(launches): refresh') &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(visual): regenerate snapshot')
        )
      }}
    # 45 → 60: the launch/ascent+descent epic (2026-07) added a large batch of
    # /fly + surface 3D specs, pushing the heaviest shard (mobile-landscape 1-of-2:
    # 21 min pre-epic → 36+ min) and desktop 1-of-2 (~40 min) close to / over the
    # old 45-min cap. No test failures — a capacity cap, not a bug. Headroom to 60;
    # if shards keep creeping up, split them further (the scalable fix) rather than
    # raising this again.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # When triggered via workflow_run, pin to the exact SHA that
          # passed CI — not the latest of main (which may have moved on
          # if a newer commit landed between CI completing and
          # docker-e2e starting). For manual + cron triggers, falls
          # through to the default (latest of main).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Produce build/ on the runner. The web container bind-mounts it,
      # so this step is the precondition for `docker compose up -d web`
      # to serve anything.
      - run: npm run build

      - name: Bring up web container
        run: docker compose up -d web

      - name: Wait for web to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ >/dev/null; then
              echo "Web container responding on :8080"
              exit 0
            fi
            sleep 2
          done
          echo "Web container failed to respond within 120s — dumping logs:"
          docker compose logs web
          exit 1

      - name: Smoke-test critical paths
        run: |
          set -e
          # Production-shape nginx must serve: SPA root, a sub-route,
          # the data manifest with no-cache, and an immutable hashed
          # asset with the year-long cache header.
          curl -sf http://localhost:8080/ >/dev/null
          curl -sf http://localhost:8080/missions/launches >/dev/null
          curl -sfI http://localhost:8080/data/launches.json | grep -i 'cache-control: no-cache'
          curl -sfI http://localhost:8080/data/launches.json | grep -i 'content-type: application/json'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against docker web (${{ matrix.project }} ${{ matrix.shard_id }})
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        # Per-shard run. Desktop legs use `1/2` + `2/2`, mobile legs
        # `1/4`..`4/4`; Playwright partitions tests across shards by file
        # count. fail-fast: false on the strategy so one shard's failure
        # doesn't suppress the others' diagnostics.
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      # Diagnostics fire on both failure AND cancellation. A job that
      # times out after 45 min reports `cancelled`, not `failed`, so
      # `if: failure()` alone silently dropped the playwright-report
      # whenever the suite hit the timeout — which is exactly when we
      # most need the report. Same gating for the web container logs.
      - name: Capture web logs on failure or cancellation
        if: failure() || cancelled()
        run: docker compose logs web

      - name: Upload Playwright report on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-e2e-playwright-report-${{ matrix.project }}-${{ matrix.shard_id }}
          path: playwright-report/
          retention-days: 14

      # test-results/ holds per-spec error-context.md + screenshots —
      # smaller than the full HTML report and faster to grep when
      # triaging cascade failures. Same cancellation gating.
      - name: Upload raw test-results on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-e2e-test-results-${{ matrix.project }}-${{ matrix.shard_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down

  # ════════════════════════════════════════════════════════════════════
  # publish — pushes the pipeline-runner image to GHCR (multi-arch).
  #
  # Pattern adapted from podcast_scraper's stack-test.yml (RFC-081 §Layer 1).
  # Two-stage buildx per image:
  #   1. amd64-only `--load` so check-no-secrets-in-image.sh can run
  #      against a real local image. BuildKit multi-arch output can't
  #      be --load'd (single-arch daemon).
  #   2. amd64+arm64 `--push` directly to GHCR with cache reused from
  #      step 1 (amd64 layer is near-instant; arm64 is the new cost).
  #
  # NOT published:
  #   - `web` container — it's stock nginx:alpine + bind-mounted ./build
  #     per ADR-063. The deploy unit is the static bundle, not an image.
  #
  # Tags pushed:
  #   :main         — track-latest-green-main tag
  #   :sha-<short>  — pin-and-rollback tag for incident response
  # ════════════════════════════════════════════════════════════════════
  # Per-platform build jobs run in PARALLEL on NATIVE runners — no QEMU.
  # Each pushes a digest-only image (no tag) to GHCR; the `publish-manifest`
  # job then assembles them into a multi-arch tag list (:main + :sha-XXX).
  #
  # Why native runners (was: single job + QEMU): `npm ci` in the Dockerfile
  # compiles sharp + canvas + gdal-async bindings against the target arch.
  # On amd64-via-QEMU the arm64 build took ~20-25 min, pushing the whole
  # publish job past its 30-min timeout (cancelled run 26545911605, May
  # 2026). Native arm64 runners (free for public repos since 2025-01)
  # drop arm64 to ~3-5 min — same speed as amd64.
  publish-platforms:
    needs: docker-e2e
    # docker-e2e itself is triggered by CI's workflow_run, never by a
    # bare `push:`, so `github.event_name == 'push'` was permanently
    # false and publish-platforms had been silently skipped on every
    # CI-driven run — leaving the `sha-<short>` image tag deploy-prod
    # needs missing from GHCR (Deploy to prod VPS failure 2026-06-16
    # on commit aff14496). Check the *upstream* CI run's trigger via
    # `github.event.workflow_run.event` so a CI run that itself fired
    # on a `push` to main publishes the image, and manual `dispatch`
    # or `cron` runs still skip the registry push as intended.
    if: |
      github.repository == 'chipi/orrery'
      && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.event == 'push')
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    name: publish (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: chipi
      IMAGE: ghcr.io/chipi/orrery-pipeline-runner
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: build with --load so the no-secrets gate can `docker
      # run` against a real local image. arm64 skips this (the assert
      # already passes on amd64; reproducing it on arm64 buys nothing).
      - name: Build amd64 + assert no secrets
        if: matrix.arch == 'amd64'
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHORT_SHA:0:7}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE}:build-${SHORT}" \
            --load \
            --cache-from "type=gha,scope=publish-pipeline-runner-amd64" \
            --cache-to "type=gha,scope=publish-pipeline-runner-amd64,mode=max" \
            -f Dockerfile .
          scripts/check-no-secrets-in-image.sh "${IMAGE}:build-${SHORT}"

      # Push per-platform digest. No tag — the manifest job tags later.
      # Reuses the cache from the assert-step above on amd64 so the
      # actual rebuild is nearly free.
      - name: Build + push digest-only
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-pipeline-runner-${{ matrix.arch }}
          cache-to: type=gha,scope=publish-pipeline-runner-${{ matrix.arch }},mode=max

      # Export the digest for the manifest job. Per-arch artifact name
      # avoids cross-matrix file collisions.
      - name: Export digest
        id: export
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          # Strip "sha256:" prefix; manifest job re-adds it.
          echo "${DIGEST#sha256:}" > "/tmp/digests/${{ matrix.arch }}"
          echo "digest-${{ matrix.arch }}=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Assembles the two per-platform digests into a multi-arch manifest
  # under the user-facing tags (:main + :sha-XXX). Cheap step (~30 s) —
  # no build, just `buildx imagetools create`.
  publish-manifest:
    needs: publish-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: chipi
      IMAGE: ghcr.io/chipi/orrery-pipeline-runner
    steps:
      - name: Download all digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble + push multi-arch manifest
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          DIGEST_AMD64="sha256:$(cat /tmp/digests/amd64)"
          DIGEST_ARM64="sha256:$(cat /tmp/digests/arm64)"
          docker buildx imagetools create \
            --tag "${IMAGE}:main" \
            --tag "${IMAGE}:sha-${SHORT}" \
            "${IMAGE}@${DIGEST_AMD64}" \
            "${IMAGE}@${DIGEST_ARM64}"

      # #712-style acceptance gate (per podcast_scraper RFC-081): assert
      # the pushed manifest actually carries both linux/amd64 + linux/arm64.
      # Belt-and-suspenders against silent platform regressions if someone
      # later removes the arm64 leg from the matrix.
      - name: Verify multi-arch manifest
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          echo "==> Inspecting ${IMAGE}:sha-${SHORT}"
          MANIFEST=$(docker buildx imagetools inspect "${IMAGE}:sha-${SHORT}" --raw)
          for ARCH in amd64 arm64; do
            if ! echo "$MANIFEST" | grep -q "\"architecture\": \"${ARCH}\""; then
              echo "::error::${IMAGE}:sha-${SHORT} missing linux/${ARCH} in manifest"
              echo "$MANIFEST"
              exit 1
            fi
          done
          echo "  ${IMAGE}:sha-${SHORT} OK (amd64 + arm64)"

      - name: Summary
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          {
            echo "## GHCR publish complete (multi-arch, native runners)"
            echo ""
            echo "Pushed the pipeline-runner image with tags \`:main\` + \`:sha-${SHORT}\`,"
            echo "as a multi-arch manifest covering \`linux/amd64\` + \`linux/arm64\`."
            echo ""
            echo "Each platform built on its own native runner (no QEMU):"
            echo "* amd64 on \`ubuntu-latest\`"
            echo "* arm64 on \`ubuntu-24.04-arm\` (free for public repos since 2025-01)"
            echo ""
            echo "* \`${IMAGE}:main\`"
            echo "* \`${IMAGE}:sha-${SHORT}\`"
            echo ""
            echo "The \`web\` container is intentionally NOT published — it's"
            echo "stock nginx:alpine + bind-mounted \`./build\` per ADR-063."
            echo "The static bundle is the deploy artefact, not an image."
          } >> "$GITHUB_STEP_SUMMARY"
