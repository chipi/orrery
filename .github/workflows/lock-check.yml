name: Lock check

# Cold `npm ci` on Linux for every non-main branch push.
#
# WHY: `ci.yml` only runs on `push: [main]` / `pull_request: [main]`, and
# Orrery merges feature branches straight to local main (no PRs). So a
# long-lived branch never gets a Linux `npm ci` until it's already merged —
# and a macOS `npm install` silently strips Linux-only optional peer deps
# (@emnapi/* pulled transitively by @rolldown/binding-wasm32-wasi) from the
# lockfile, which only detonates on the first main CI run POST-merge. This
# job surfaces that drift on the branch push instead, before the merge.
# See docs/wip/2026-07-23-explore-overhaul-handover.md §0.
#
# `--ignore-scripts` because the "Missing X from lock file" failure happens
# during resolution, before any postinstall runs — so this catches the exact
# drift the full CI would, faster.

on:
  push:
    branches-ignore: [main]

concurrency:
  group: "lock-check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
      - name: npm ci (lockfile sync check)
        run: npm ci --ignore-scripts
