name: native-build

# Compile the Capacitor apps (Android debug APK, iOS simulator app) so a
# Capacitor, plugin or Sentry bump that breaks a native build shows up here
# instead of on the next hand build. Build only: no signing, no store upload
# (fastlane / TestFlight stays manual, docs/guides/mobile-build-and-deploy.md).
#
# Runs when native-relevant files change on main or an opt-in branch, weekly
# for drift (Xcode / Gradle images move under us), and by hand.

on:
  push:
    branches: [main, 'e2e/**', 'tech-debt/**']
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-build.yml'
  schedule:
    - cron: '23 4 * * 1' # Mondays, outside the docker-e2e (05:07) and TLE (04:00) slots
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-node
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 needs JDK 21
          cache: gradle
      - run: npm ci
      - name: Build the mobile web bundle
        run: npm run build:mobile
      - name: Sync into the Android project
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK version follows package.json; FINE location up to API 30
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/aapt"
          badging="$("$aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk)"
          want="$(node -p "require('./package.json').version")"
          got="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -1)"
          echo "versionName: $got (package.json $want)"
          [ "$got" = "$want" ] || { echo "::error::APK versionName $got != package.json $want"; exit 1; }
          # Capacitor's WebView asks for COARSE+FINE together and only accepts
          # COARSE alone from API 31, so FINE must be declared for API 24-30.
          grep -q "uses-permission: name='android.permission.ACCESS_FINE_LOCATION' maxSdkVersion='30'" <<<"$badging" \
            || { echo "::error::ACCESS_FINE_LOCATION (maxSdkVersion 30) missing from the APK"; exit 1; }
          # The offline packs stay out of Auto Backup (res/xml/*_rules.xml).
          manifest="$("$aapt" dump xmltree android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml)"
          for attr in fullBackupContent dataExtractionRules; do
            grep -q "android:$attr" <<<"$manifest" || { echo "::error::android:$attr missing from the APK manifest"; exit 1; }
          done

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - name: Build the mobile web bundle
        run: npm run build:mobile
      - name: Sync into the iOS project (installs pods)
        run: npx cap sync ios
      - name: Build for the simulator, unsigned
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      - name: App version follows package.json
        run: |
          # build:mobile writes MARKETING_VERSION from package.json; a diff here
          # means the committed project.pbxproj is stale.
          git diff --exit-code -- ios/App/App.xcodeproj/project.pbxproj \
            || { echo "::error::project.pbxproj MARKETING_VERSION is not package.json's; commit the sync"; exit 1; }
          want="$(node -p "require('./package.json').version.split('-')[0]")"
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app/Info.plist")"
          echo "CFBundleShortVersionString: $got (package.json $want)"
          [ "$got" = "$want" ] || { echo "::error::app version $got != package.json $want"; exit 1; }
      - name: Privacy manifest is in the app bundle
        run: |
          f="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy"
          [ -f "$f" ] || { echo "::error::PrivacyInfo.xcprivacy is not in App.app (Copy Bundle Resources)"; exit 1; }
          plutil -lint "$f"
