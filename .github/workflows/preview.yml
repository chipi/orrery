name: Deploy preview

# Pipeline position: APP-bundle + docs deploy runs ONLY after e2e
# succeeds on main. Chain: ci.yml ──► e2e.yml ──► preview.yml.
# Replaces the prior `push: main` trigger so a CI or e2e failure
# short-circuits the pipeline instead of deploying broken code to
# GitHub Pages.
#
# Manual + weekly cron triggers stay independent of the chain so a
# Monday rebuild for fresh imagery (ADR-016) still fires even if the
# repo hasn't been touched in a week.
#
# Split from `deploy-docs.yml` per ADR-070: docs site fires on CI
# success regardless of e2e state (mobile-only flakes shouldn't block
# docs publish). This workflow continues to publish the full build/
# (app + docs) on e2e green. Shared concurrency group
# `gh-pages-publish` serializes against deploy-docs so two workflows
# don't race on the gh-pages branch.

on:
  workflow_run:
    workflows: ['e2e']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild keeps NASA mission imagery + any external assets
  # fresh per ADR-016 — Mondays 06:00 UTC catches a new week's
  # featured imagery without a manual push.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  # ADR-070: serialize against deploy-docs.yml on the gh-pages branch.
  # Both workflows publish to gh-pages; without the shared group they
  # race + the later one wins. cancel-in-progress: false so a mid-
  # publish isn't aborted (leaves gh-pages in an unknown state).
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run fires on every completion; only deploy on success.
    # Manual + cron triggers always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy the exact SHA that passed e2e (not the latest of main,
          # which may have moved on). For manual + cron triggers, falls
          # through to the default (latest of main).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /orrery/
          # Sentry — RFC-025 / ADR-067. SENTRY_DSN_WEB is set once in
          # repo settings → Secrets → Actions; forks don't have it, so
          # their build produces a bundle with empty PUBLIC_SENTRY_DSN
          # and the SDK no-ops. PUBLIC_SENTRY_RELEASE is the GH SHA so
          # Sentry can group errors per deploy.
          PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          PUBLIC_SENTRY_ENVIRONMENT: production
          PUBLIC_SENTRY_RELEASE: gha-${{ github.sha }}
      - run: npm run docs:build
        env:
          DOCS_BASE: /orrery/docs/
      - run: cp -R docs/.vitepress/dist build/docs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
