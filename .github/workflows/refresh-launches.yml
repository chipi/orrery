name: Refresh launches manifest

# PRD-020 M11 / RFC-023 §11.
#
# Runs every 6h at minute 17 (off-the-hour to avoid the round-minute
# thundering herd against LL2's 15 req/hour anonymous tier). Pulls the
# multi-source pipeline (NASA / SpaceX / ESA agency-direct + GCAT
# historic + LL2 fallback), regenerates launches.json +
# launches-historic/*.json, commits the diff if non-empty so the
# standard CI deploy chain picks up the refresh.
#
# Bot identity: orrery-launches-bot. Pushes direct to main —
# main's branch protection must allow this workflow (either via
# a PAT in secrets.LAUNCHES_BOT_TOKEN with bypass-protection rights,
# OR via "Allow specified actors to bypass required pull requests"
# configured for the bot in repo settings → Branches → main). The
# default workflow GITHUB_TOKEN cannot bypass protection — that's
# what produces GH006 "Protected branch update failed" if the PAT
# fallback isn't configured.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          # Prefer the bypass-capable PAT when configured; fall through
          # to the default token for first-run / locally-tested cases.
          # actions/checkout configures git remote with whichever token
          # we hand it, so the subsequent `git push` reuses the same
          # credentials.
          token: ${{ secrets.LAUNCHES_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Pull launches from all sources
        env:
          # Optional Patreon-tier LL2 key. Anonymous tier is fine for
          # v0.1's 6h cadence (~30 calls per refresh, well under the
          # 15/hour anonymous cap when amortised).
          LL2_PATREON_KEY: ${{ secrets.LL2_PATREON_KEY }}
        run: npm run fetch:launches

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name 'orrery-launches-bot'
          git config user.email 'launches-bot@orrery.local'
          if [[ -n "$(git status --porcelain static/data/launches.json static/data/launches-historic/)" ]]; then
            git add static/data/launches.json static/data/launches-historic/
            # Stats are emitted by the orchestrator's audit-report — fall back to a
            # simple ISO-timestamped message when not present.
            TS=$(date -u +%Y-%m-%dT%H:%MZ)
            git commit -m "chore(launches): refresh — ${TS}"
            # main can advance during the multi-minute fetch/preflight; a plain push
            # then loses the push-race (rejected "fetch first"). Rebase our single
            # data commit onto the moved tip and retry (conflict-free: nothing else
            # touches launches.json). Seen 2026-07-16 racing a manual main push.
            pushed=0
            for attempt in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push rejected — rebasing onto origin/${GITHUB_REF_NAME:-main} and retrying (${attempt}/3)…"
              git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            done
            [[ "$pushed" == 1 ]] || { echo "launches push failed after 3 rebase-retries"; exit 1; }
          else
            echo "No launches manifest changes — skipping commit."
          fi
