name: Regenerate visual snapshots

# Manual-only workflow. When the team intentionally changes a UI
# surface that's covered by `tests/e2e/visual.spec.ts`, the linux
# baseline PNGs need to be regenerated to match the new layout.
# Doing this locally requires Docker + the Playwright image; this
# workflow runs the regen on a Linux CI runner — same environment
# the actual e2e job runs in — and commits the refreshed PNGs back
# to the triggered branch.
#
# Trigger:
#   gh workflow run "Regenerate visual snapshots" --ref <branch>
#
# The bot pushes direct to the triggered branch using
# LAUNCHES_BOT_TOKEN (same PAT as the launches refresher). For main
# branch this works because the PAT has bypass-protection rights;
# for feature branches it works because no protection rule fires.
#
# Output: a single commit on the triggered branch with the message
# "chore(visual): regenerate snapshot baselines" carrying the new
# PNGs. Inspect the commit + merge / continue iteration on the
# branch.
#
# Don't let that bot commit be the LAST commit a PR lands on main.
# docker-e2e and mobile-e2e skip any main push whose head commit is
# "chore(visual): regenerate snapshot…" (so a bot regen doesn't re-run
# the suite), which also skips publish-platforms. That leaves no
# `sha-<short>` pipeline-runner image for Deploy to prod to use. It
# happened to #611 on 2026-10-16: the regen was the branch's final
# commit, so a follow-up commit was needed before the deploy. Add a
# real commit after the regen, or squash it into one.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Use the PAT for fetch so the subsequent push reuses the
          # same credentials — see .github/workflows/refresh-launches.yml
          # for the same pattern. Falls through to GITHUB_TOKEN when
          # the secret isn't configured (push will then 403 on a
          # protected branch — same trade-off as the launches bot).
          token: ${{ secrets.LAUNCHES_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          # Need the full history so we can push back; default depth=1
          # works for forward-only pushes but breaks if a branch has
          # diverged.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Regenerate visual baselines
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name 'orrery-snapshot-bot'
          git config user.email 'snapshot-bot@orrery.local'
          if [[ -n "$(git status --porcelain tests/e2e/visual.spec.ts-snapshots/)" ]]; then
            git add tests/e2e/visual.spec.ts-snapshots/
            git commit -m "chore(visual): regenerate snapshot baselines"
            # --no-verify: npm ci installs the husky pre-push hook on the runner,
            # and a full preflight here re-validates what this workflow just built
            # and blows the 20-min job timeout (runs get 'cancelled' mid-push).
            # The bot pushes only regenerated PNGs; CI validates the branch itself.
            git push --no-verify origin HEAD:${{ github.ref_name }}
          else
            echo "No baseline changes — exiting clean."
          fi
