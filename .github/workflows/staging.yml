name: Deploy preview

# Pipeline position: APP-bundle + docs deploy runs ONLY after docker-e2e
# succeeds on main. Chain: ci.yml ──► docker-e2e.yml ──► preview.yml.
# Replaces the prior `push: main` trigger so a CI or docker-e2e failure
# short-circuits the pipeline instead of deploying broken code to
# GitHub Pages.
#
# Per ADR-071: docker-e2e is the canonical Playwright gate; e2e.yml was
# retired because vite preview was never a real deploy target and W7
# sharding had already made mobile-chromium run in both workflows.
#
# Manual + weekly cron triggers stay independent of the chain so a
# Monday rebuild for fresh imagery (ADR-016) still fires even if the
# repo hasn't been touched in a week.
#
# Split from `deploy-docs.yml` per ADR-070: docs site fires on CI
# success regardless of docker-e2e state (mobile-only flakes shouldn't
# block docs publish). This workflow continues to publish the full
# build/ (app + docs) on docker-e2e green. Shared concurrency group
# `gh-pages-publish` serializes against deploy-docs so two workflows
# don't race on the gh-pages branch.

on:
  workflow_run:
    workflows: ['docker-e2e']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild keeps NASA mission imagery + any external assets
  # fresh per ADR-016 — Mondays 06:00 UTC catches a new week's
  # featured imagery without a manual push.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  # ADR-070: serialize against deploy-docs.yml on the gh-pages branch.
  # Both workflows publish to gh-pages; without the shared group they
  # race + the later one wins. cancel-in-progress: false so a mid-
  # publish isn't aborted (leaves gh-pages in an unknown state).
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The `staging` GitHub Environment scopes the o11y secrets to their STAGING
    # values (PUBLIC_SENTRY_DSN / PUBLIC_UMAMI_WEBSITE_ID are environment secrets,
    # defined per-env with different values — prod vs staging — NOT repo-level).
    # Without this the build gets an empty DSN and Sentry no-ops. The staging env
    # has no protection rules, so this does not gate/pause the auto-deploy.
    environment: staging
    # workflow_run fires on every completion; only deploy on success.
    # Manual + cron triggers always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Deploy the exact SHA that passed docker-e2e (not the latest
          # of main, which may have moved on). For manual + cron
          # triggers, falls through to the default (latest of main).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /orrery/
          # o11y — RFC-025 / ADR-067. These are the `staging` GitHub Environment
          # secrets (see `environment: staging` above) — same NAMES as prod,
          # different VALUES, so staging events are separated from prod's. The
          # DSN/Umami keys are public (ship in the bundle) + ingest-only. Forks
          # lack the env → empty → the SDKs no-op. RELEASE = GH SHA for grouping.
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SENTRY_ENVIRONMENT: staging
          PUBLIC_SENTRY_RELEASE: gha-${{ github.sha }}
          # Umami — staging has its OWN website id, so staging pageviews land in a
          # separate Umami site and never pollute prod's numbers.
          PUBLIC_UMAMI_HOST: https://analytics.orrerylearn.com
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}
      - run: npm run docs:build
        env:
          DOCS_BASE: /orrery/docs/
      - run: cp -R docs/.vitepress/dist build/docs
      # Deploy fingerprint the staging smoke polls to confirm the NEW build is
      # live before validating (GitHub Pages has a publish lag). validate-
      # staging.yml waits until /orrery/_deploy-sha.txt matches this SHA.
      - run: git rev-parse HEAD > build/_deploy-sha.txt
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
