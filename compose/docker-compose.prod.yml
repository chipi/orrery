# orrery prod compose stack — GH #260 phase 1 (tailnet-only) + #263
# observability wiring.
#
# Designed to run alongside podcast_scraper on the existing Hetzner VPS.
# Co-tenancy mechanics (per #260):
#   1. project name `orrery` (set via COMPOSE_PROJECT_NAME in the
#      staged /srv/orrery/.env)
#   2. host port `${ORRERY_PORT:-8090}` (podcast_scraper holds 8080)
#   3. filesystem root `/srv/orrery/` on the VPS
#   4. tailscale serve on a different HTTPS port (`--https=8443` per
#      #260 recommendation (a)) — root-owned wrapper invoked via
#      narrow sudoers, per podcast_scraper#838.
#
# Env source-of-truth (#263, mirrors podcast_scraper deploy.yml#L147-218):
#   /srv/orrery/.env is rendered every deploy from GH `prod`-scoped
#   secrets by the workflow's "Stage /srv/orrery/.env" step. The file is
#   atomic (mktemp + scp + mv), shm-tmp on the runner, never committed.
#   Missing secrets → empty values → `${VAR:-}` defaults take over,
#   integrations silently no-op, stack still starts.
#
# What's different from the dev `docker-compose.yml` at repo root:
#   - `pipeline-runner` pulls `ghcr.io/chipi/orrery-pipeline-runner` from
#     GHCR (published by `.github/workflows/docker-e2e.yml` -> publish job)
#     instead of building locally
#   - `web` healthcheck declared explicitly (compose-level, not Dockerfile)
#   - `restart: unless-stopped` on long-running services
#   - the `orrery-cache` and any other dev-only services are NOT here
#
# Volume strategy:
#   - `./build` (host) bind-mounted into nginx as the static-bundle source.
#     Uploaded by the deploy workflow as a release artefact; VPS does not
#     run `npm run build`.
#   - `./static/data` (host) bind-mounted into nginx + pipeline-runner per
#     ADR-065 (live `/data` overlay; cron-driven pipeline writes,
#     web reads on next request — no rebuild needed).
#
# Bring up (from /srv/orrery on the VPS):
#   docker compose -f compose/docker-compose.prod.yml \
#     --project-directory . --env-file .env \
#     --profile observability pull
#   docker compose -f compose/docker-compose.prod.yml \
#     --project-directory . --env-file .env \
#     --profile observability up -d
#
# The staged /srv/orrery/.env contains the per-deploy
# ORRERY_PIPELINE_IMAGE_TAG=sha-<7> set by the workflow.

services:
  web:
    # Custom image: nginx:alpine + brotli module + baked nginx.conf
    # (GH #273 / W3). Image is built fresh on each deploy by the
    # workflow's `docker compose build web` step — see
    # .github/workflows/deploy-prod.yml. `context: ..` resolves to the
    # repo root from this file's compose/ subdirectory; the Dockerfile
    # path is relative to that context.
    build:
      context: ..
      dockerfile: ops/docker/Dockerfile.web
    image: orrery-web:local
    container_name: orrery-web
    restart: unless-stopped
    ports:
      # Host-side port is parametric so the operator can shift it
      # without editing this file. 8090 default avoids podcast_scraper's
      # 8080. Container-internal is plain :80 (nginx default).
      - '${ORRERY_PORT:-8090}:80'
    volumes:
      # Static bundle (deployed as a release artefact by the deploy
      # workflow; VPS does not run `npm run build` per ADR-063).
      - ./build:/usr/share/nginx/html:ro
      # Live data overlay (ADR-065). Pipeline-runner writes here; nginx
      # reads on next request.
      - ./static/data:/usr/share/nginx/html/data:ro
    healthcheck:
      # busybox wget on alpine; accept any HTTP/ response line as proof
      # nginx is alive (mirrors podcast_scraper's compose pattern).
      test: ['CMD-SHELL', "wget -qSO /dev/null http://127.0.0.1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Pipeline-runner image pulled from GHCR. One-shot invocations spawned
  # by host cron (or `docker compose run --rm pipeline-runner ...`).
  # Image tag pinned via env var so the deploy workflow can roll forward
  # or back without compose-file edits.
  pipeline-runner:
    image: ghcr.io/chipi/orrery-pipeline-runner:${ORRERY_PIPELINE_IMAGE_TAG:-main}
    container_name: orrery-pipeline-runner
    # Not long-running — the API design (RFC-024) spawns `docker compose
    # run --rm pipeline-runner ...` on demand. The service declaration
    # exists so `docker compose run` resolves the image + volume mounts;
    # `restart` is intentionally omitted to keep the runner ephemeral.
    profiles: ['manual']
    volumes:
      # Pipelines write to static/data on the host; the web container's
      # bind-mount picks up the change on next request.
      - ./static/data:/repo/static/data
      # Read-only repo bind so the runner can invoke any
      # scripts/<name>.ts entry-point.
      - .:/repo:ro
    environment:
      # No secrets by default — RFC-025 §3, ADR-067 / ADR-068 env vars
      # (Sentry, Grafana Cloud) are blank in phase 1. Wire later by
      # adding an operator-staged `/srv/orrery/.env.secrets` as a
      # second env_file with `required: false`.
      NODE_ENV: production
    env_file:
      # Staged from GH `prod`-scoped secrets every deploy (#263).
      # Path is project-directory-relative (workflow passes
      # --project-directory .) so this resolves to /srv/orrery/.env.
      - .env

  # ───────────────────────────────────────────────────────────────────
  # Observability: Grafana Cloud Agent (ADR-068 / #263).
  #
  # Tails Docker container stdout/stderr of orrery-* containers via the
  # docker_sd_configs in ops/observability/grafana-agent.yaml and ships
  # them to Grafana Cloud Loki. Sidecar-shaped — no orrery code knows it
  # exists; it watches via the read-only docker socket.
  #
  # Profile-gated: only spins up when the operator passes
  # `--profile observability`. The deploy workflow always passes it; if
  # GRAFANA_CLOUD_* env vars are empty the agent-entrypoint.sh wrapper
  # swaps in grafana-agent.silent.yaml so the agent runs (idempotent
  # restart) but ships zero bytes. This keeps the deploy idempotent —
  # adding/rotating creds is just a re-run.
  #
  # Same Grafana Cloud stack as podcast_scraper is intentional — both
  # apps' logs stream to the same Loki, separated by the `app` label
  # (set by external_labels in grafana-agent.yaml). Query orrery-only
  # with `{app="orrery"}`.
  grafana-agent:
    image: grafana/agent:v0.43.4
    container_name: orrery-grafana-agent
    profiles: ['observability']
    restart: unless-stopped
    volumes:
      # Three configs: real (shipping), silent (no-op), and the
      # entrypoint wrapper that picks based on env-var presence. Same
      # files as the dev stack — committed in ops/observability/.
      - ./ops/observability/grafana-agent.yaml:/etc/grafana-agent.yaml:ro
      - ./ops/observability/grafana-agent.silent.yaml:/etc/grafana-agent.silent.yaml:ro
      - ./ops/observability/agent-entrypoint.sh:/agent-entrypoint.sh:ro
      # Read-only docker socket for docker_sd discovery of orrery-*
      # containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL:-}
      - GRAFANA_CLOUD_LOKI_USER=${GRAFANA_CLOUD_LOKI_USER:-}
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY:-}
      - GRAFANA_AGENT_ENV=${GRAFANA_AGENT_ENV:-production-orrery}
    # Wrapper picks shipping vs silent config based on env-var presence.
    # Without it, empty GRAFANA_CLOUD_LOKI_URL crashes the agent in a
    # restart loop on "client needs target URL".
    entrypoint: ['/bin/sh', '/agent-entrypoint.sh']
    command: []
