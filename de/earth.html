    <!-- Stamp viewport-capability attributes on <html> BEFORE first paint so the
         responsive CSS (html[data-touch][data-orientation]…) is correct
         immediately. These attributes are device-dependent and cannot be
         prerendered (one HTML serves every device). Query strings are kept in
         sync with src/lib/viewport.svelte.ts, which keeps them live post-hydration. -->
    <script>
      try {
        if (window.matchMedia) {
          var d = document.documentElement;
          var touch =
            matchMedia('(pointer: coarse)').matches || matchMedia('(hover: none)').matches;
          if (touch) d.setAttribute('data-touch', '');
          d.setAttribute(
            'data-orientation',
            matchMedia('(orientation: landscape)').matches ? 'landscape' : 'portrait',
          );
          if (matchMedia('(max-height: 560px)').matches) d.setAttribute('data-short', '');
          d.setAttribute(
            'data-form',
            !touch
              ? 'desktop'
              : matchMedia('(min-width: 600px) and (min-height: 600px)').matches
                ? 'tablet'
                : 'phone',
          );
        }
      } catch (e) {}
    </script>
