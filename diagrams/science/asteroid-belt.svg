<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="The asteroid belt as a band between Mars and Jupiter. Major members Ceres, Vesta, Pallas, and Hygiea labelled; arrows from Jupiter show its gravity stirring the inner belt and preventing planet formation.">
  <style>
    .bg { fill: #0a0c1e; }
    .star { fill: rgba(255,255,255,0.45); }
    .dim-star { fill: rgba(255,255,255,0.2); }
    .sun { fill: #ffb347; stroke: #ffd47b; stroke-width: 1.2; }
    .mars { fill: #c9603a; }
    .jupiter { fill: #d8a86a; stroke: #f0c98c; stroke-width: 0.5; }
    .belt-rock { fill: #b8a470; }
    .belt-rock-dim { fill: rgba(184,164,112,0.55); }
    .ceres { fill: #c8b896; stroke: #e0d4af; stroke-width: 0.8; }
    .vesta { fill: #a99378; }
    .arrow { fill: none; stroke: #ffd47b; stroke-width: 1.4; opacity: 0.55; }
    .arrow-head { fill: #ffd47b; opacity: 0.55; }
    .label { font-family: 'Space Mono', monospace; font-size: 11px; fill: #d9dde7; letter-spacing: 1px; }
    .label-dim { font-family: 'Space Mono', monospace; font-size: 9px; fill: rgba(217,221,231,0.6); letter-spacing: 1px; }
    .eyebrow { font-family: 'Space Mono', monospace; font-size: 8px; fill: rgba(184,164,112,0.85); letter-spacing: 2px; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; fill: #fff; letter-spacing: 2.5px; }
    .au { font-family: 'Space Mono', monospace; font-size: 8px; fill: rgba(255,255,255,0.35); letter-spacing: 1px; }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="320" />
  <!-- background starfield -->
  <circle class="star" cx="60" cy="40" r="1.1"/>
  <circle class="dim-star" cx="120" cy="80" r="0.9"/>
  <circle class="star" cx="180" cy="30" r="1"/>
  <circle class="dim-star" cx="240" cy="90" r="0.8"/>
  <circle class="dim-star" cx="320" cy="50" r="1"/>
  <circle class="star" cx="400" cy="40" r="0.9"/>
  <circle class="dim-star" cx="490" cy="70" r="0.9"/>
  <circle class="dim-star" cx="570" cy="40" r="1"/>
  <circle class="star" cx="660" cy="80" r="1.1"/>
  <circle class="dim-star" cx="40" cy="290" r="1"/>
  <circle class="star" cx="220" cy="280" r="0.9"/>
  <circle class="dim-star" cx="430" cy="285" r="0.8"/>
  <circle class="star" cx="610" cy="270" r="1"/>

  <!-- Title -->
  <text class="title" x="20" y="40">ASTEROID BELT</text>
  <text class="eyebrow" x="20" y="60">2.2 – 3.2 AU · MARS / JUPITER GAP</text>

  <!-- Sun anchor (off-frame to the left for scale; show partial disc) -->
  <circle class="sun" cx="-30" cy="180" r="60" />
  <text class="label-dim" x="20" y="180" text-anchor="start">☉ Sun</text>

  <!-- Mars orbit indicator -->
  <line x1="180" y1="100" x2="180" y2="260" stroke="rgba(201,96,58,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle class="mars" cx="180" cy="200" r="9"/>
  <text class="label" x="180" y="240" text-anchor="middle">MARS</text>
  <text class="au" x="180" y="254" text-anchor="middle">1.52 AU</text>

  <!-- Belt particle band — multiple dot clusters between 220 and 460 -->
  <g opacity="0.85">
    <circle class="belt-rock" cx="240" cy="170" r="1.6"/>
    <circle class="belt-rock" cx="260" cy="190" r="1.3"/>
    <circle class="belt-rock-dim" cx="280" cy="180" r="1.5"/>
    <circle class="belt-rock" cx="295" cy="210" r="1.4"/>
    <circle class="belt-rock-dim" cx="315" cy="175" r="1.2"/>
    <circle class="belt-rock" cx="330" cy="200" r="1.6"/>
    <circle class="belt-rock-dim" cx="350" cy="185" r="1.4"/>
    <circle class="belt-rock" cx="370" cy="215" r="1.3"/>
    <circle class="belt-rock-dim" cx="385" cy="175" r="1.5"/>
    <circle class="belt-rock" cx="405" cy="195" r="1.4"/>
    <circle class="belt-rock-dim" cx="425" cy="210" r="1.3"/>
    <circle class="belt-rock" cx="445" cy="180" r="1.6"/>
    <circle class="belt-rock-dim" cx="460" cy="200" r="1.4"/>
    <!-- second pass for density -->
    <circle class="belt-rock-dim" cx="250" cy="200" r="1.0"/>
    <circle class="belt-rock-dim" cx="290" cy="200" r="1.0"/>
    <circle class="belt-rock-dim" cx="330" cy="170" r="1.0"/>
    <circle class="belt-rock-dim" cx="370" cy="195" r="1.0"/>
    <circle class="belt-rock-dim" cx="410" cy="175" r="1.0"/>
    <circle class="belt-rock-dim" cx="445" cy="215" r="1.0"/>
  </g>

  <!-- Major members: Ceres (largest, callout) + Vesta + Pallas + Hygiea -->
  <circle class="ceres" cx="305" cy="160" r="5"/>
  <text class="label" x="305" y="148" text-anchor="middle">CERES</text>
  <text class="label-dim" x="305" y="135" text-anchor="middle">940 km · ⅓ belt mass</text>

  <circle class="vesta" cx="265" cy="225" r="3.5"/>
  <text class="label-dim" x="265" y="247" text-anchor="middle">Vesta</text>

  <circle class="vesta" cx="380" cy="155" r="3"/>
  <text class="label-dim" x="380" y="143" text-anchor="middle">Pallas</text>

  <circle class="vesta" cx="430" cy="230" r="3"/>
  <text class="label-dim" x="430" y="247" text-anchor="middle">Hygiea</text>

  <!-- Jupiter at right -->
  <line x1="560" y1="100" x2="560" y2="260" stroke="rgba(216,168,106,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle class="jupiter" cx="560" cy="200" r="28"/>
  <text class="label" x="560" y="252" text-anchor="middle">JUPITER</text>
  <text class="au" x="560" y="266" text-anchor="middle">5.2 AU</text>

  <!-- Gravity-stirring arrows from Jupiter into the belt -->
  <g>
    <path class="arrow" d="M 530 200 Q 480 130 410 165" />
    <polygon class="arrow-head" points="410,165 418,160 416,170"/>
    <path class="arrow" d="M 530 200 Q 470 200 405 195"/>
    <polygon class="arrow-head" points="405,195 414,191 414,200"/>
    <path class="arrow" d="M 530 200 Q 480 270 415 230"/>
    <polygon class="arrow-head" points="415,230 423,225 422,235"/>
  </g>

  <!-- Caption note -->
  <text class="eyebrow" x="700" y="105" text-anchor="end">JUPITER'S GRAVITY</text>
  <text class="label-dim" x="700" y="118" text-anchor="end">stirs the belt — no planet ever accreted</text>

  <!-- AU axis -->
  <line x1="180" y1="285" x2="560" y2="285" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text class="au" x="240" y="298" text-anchor="middle">2.0</text>
  <text class="au" x="305" y="298" text-anchor="middle">2.5</text>
  <text class="au" x="370" y="298" text-anchor="middle">3.0</text>
  <text class="au" x="435" y="298" text-anchor="middle">3.5</text>
  <text class="au" x="500" y="298" text-anchor="middle">4.0</text>
  <text class="au" x="720" y="298" text-anchor="end">AU</text>
</svg>
