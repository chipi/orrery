    <text x="80" y="88" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">COMMUNICATIONS BLACKOUT</text>
    <text x="80" y="124" font-size="18" text-anchor="start" fill="#cfe3fb" letter-spacing="1">the plasma sheath at peak heating turns the capsule into a mirror radio cannot cross</text>
    <!-- capsule + heat shield (shield faces down into the flow) -->
    <g transform="translate(740,395)">
      <path d="M -58 -66 L 58 -66 L 40 0 L -40 0 Z" fill="rgba(207,227,251,0.16)" stroke="#cfe3fb" stroke-width="2.4"/>
      <path d="M -40 0 Q 0 54 40 0 Z" fill="rgba(255,210,127,0.20)" stroke="#ffd27f" stroke-width="2.6"/>
      <text x="0" y="-86" font-size="14" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">capsule</text>
    </g>
    <!-- plasma sheath arcs hugging the shield, glowing ahead of it -->
    <g fill="none" stroke="#ffd27f" opacity="0.9">
      <path d="M 660 452 Q 740 520 820 452" stroke-width="3.4"/>
      <path d="M 636 448 Q 740 552 844 448" stroke-width="2.2" opacity="0.6"/>
      <path d="M 612 444 Q 740 588 868 444" stroke-width="1.6" opacity="0.4"/>
    </g>
    <text x="740" y="636" font-size="16" text-anchor="middle" fill="#ffd27f" letter-spacing="1">PLASMA SHEATH — ionised air, thousands of °C</text>
    <text x="740" y="660" font-size="13" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">free electrons reflect &amp; absorb radio below the plasma frequency</text>
    <!-- blocked downlink: leaves shield, hits sheath, is reflected back -->
    <g stroke="#e08a6a" stroke-width="2.6" fill="#e08a6a"><line x1="716" y1="452" x2="486" y2="690"/><polygon points="486,690 491,677 499,685"/></g>
    <g stroke="#e08a6a" stroke-width="3"><line x1="600" y1="590" x2="636" y2="554"/><line x1="600" y1="554" x2="636" y2="590"/></g>
    <text x="470" y="712" font-size="15" text-anchor="end" fill="#e08a6a" letter-spacing="1">downlink BLOCKED</text>
    <!-- ground station + blocked uplink bouncing off the sheath -->
    <path d="M 350 762 l 44 -32 l 44 32 z" fill="none" stroke="#7fb0e0" stroke-width="2"/>
    <text x="394" y="792" font-size="14" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">GROUND STATION</text>
    <g stroke="#7fb0e0" stroke-width="1.8" fill="#7fb0e0"><line x1="430" y1="690" x2="648" y2="470"/><polygon points="648,470 643,483 635,475"/></g>
    <path d="M 648 470 l 70 -30" stroke="#e08a6a" stroke-width="2.4" stroke-dasharray="6 5"/>
    <text x="548" y="452" font-size="13" text-anchor="middle" fill="#e08a6a" letter-spacing="1">uplink reflected</text>
    <!-- TDRS relay over the top (Shuttle mitigation) -->
    <circle cx="1200" cy="196" r="8" fill="#ffffff"/> <text x="1200" y="172" font-size="14" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">relay satellite (TDRS)</text>
    <g stroke="#ffd27f" stroke-width="2.4" fill="#ffd27f"><line x1="778" y1="348" x2="1178" y2="206"/><polygon points="1178,206 1168,215 1164,205"/></g>
    <text x="1010" y="300" font-size="14" text-anchor="middle" fill="#ffd27f" letter-spacing="1">link UP through thinner</text>
    <text x="1010" y="322" font-size="14" text-anchor="middle" fill="#ffd27f" letter-spacing="1">plasma over the top</text>
    <text x="1340" y="470" font-size="20" text-anchor="middle" fill="#e08a6a" letter-spacing="1">BLACKOUT</text>
    <text x="1340" y="500" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">~90 km → ~40 km</text>
    <text x="1340" y="524" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">3–4 minutes</text>
    <text x="1340" y="548" font-size="13" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">at peak heating</text>
    <text x="800" y="878" font-size="16" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">ends when the capsule slows into cooler air and the electron cloud thins</text>
  </g></svg>