    <text x="80" y="88" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">SKIP ENTRY — SURFING BACK OUT</text><text x="80" y="124" font-size="18" text-anchor="start" fill="#cfe3fb" letter-spacing="1">above orbital speed, one dip is too hot: skip out, coast, re-enter — two gentle bites</text>
    <!-- Earth limb bottom -->
    <path d="M -100 1120 A 1500 1500 0 0 1 1780 880" fill="rgba(127,176,224,0.06)" stroke="#7fb0e0" stroke-width="2.2"/>
    <text x="1420" y="980" font-size="16" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">EARTH</text>
    <!-- entry-interface / sensible-atmosphere line -->
    <path d="M 120 620 A 1700 1700 0 0 1 1560 520" fill="none" stroke="#cfe3fb" stroke-width="1.2" stroke-dasharray="7 9" opacity="0.7"/>
    <text x="160" y="604" font-size="15" text-anchor="start" fill="#cfe3fb" letter-spacing="1">SENSIBLE ATMOSPHERE  (~105 km)</text>
    <!-- incoming super-circular -->
    <g stroke="#ffd27f" stroke-width="3" fill="#ffd27f"><line x1="150" y1="300" x2="300" y2="470"/><polygon points="300,470 287,464 296,457"/></g>
