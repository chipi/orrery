    <text x="80" y="90" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">AEROBRAKING</text><text x="80" y="126" font-size="19" text-anchor="start" fill="#cfe3fb" letter-spacing="1">trim a wide capture orbit for almost no fuel — skim the air a little each pass</text>
    <!-- planet + atmosphere + shrinking ellipses sharing periapsis -->
    <g transform="translate(520,470)">
      <circle cx="0" cy="0" r="120" fill="rgba(127,176,224,0.14)" stroke="#7fb0e0" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="150" fill="none" stroke="#ffd27f" stroke-width="1.6" stroke-dasharray="4 6"/>
      <text x="0" y="8" font-size="15" text-anchor="middle" fill="#ffffff" letter-spacing="1">PLANET</text>
      <text x="190" y="-140" font-size="14" text-anchor="start" fill="#ffd27f" letter-spacing="1">upper atmosphere</text>
      <ellipse cx="230" cy="0" rx="360" ry="150" fill="none" stroke="#cfe3fb" stroke-width="2.4"/>
      <ellipse cx="180" cy="0" rx="300" ry="128" fill="none" stroke="#7fb0e0" stroke-width="1.8" stroke-dasharray="6 6"/>
      <ellipse cx="130" cy="0" rx="240" ry="108" fill="none" stroke="#7fb0e0" stroke-width="1.6" stroke-dasharray="4 8" opacity="0.8"/>
      <ellipse cx="60" cy="0" rx="170" ry="92" fill="none" stroke="#7fb0e0" stroke-width="1.4" stroke-dasharray="3 9" opacity="0.6"/>
      <circle cx="-150" cy="0" r="7" fill="#ffd27f"/>
      <text x="-165" y="-20" font-size="13" text-anchor="end" fill="#ffd27f" letter-spacing="1">periapsis — grazes the air</text>
    </g>
    <text x="1180" y="300" font-size="15" text-anchor="start" fill="#cfe3fb" letter-spacing="1">capture ellipse (wide)</text>
    <text x="1180" y="470" font-size="15" text-anchor="start" fill="#7fb0e0" letter-spacing="1">each dip lowers</text>
    <text x="1180" y="494" font-size="15" text-anchor="start" fill="#7fb0e0" letter-spacing="1">the far side...</text>
    <text x="1180" y="640" font-size="15" text-anchor="start" fill="#ffffff" letter-spacing="1">→ circular science orbit</text>
    <text x="800" y="850" font-size="17" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">hundreds of passes over months — saves fuel often exceeding the spacecraft dry mass</text>
  </g></svg>