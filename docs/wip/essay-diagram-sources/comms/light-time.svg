    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">THE CONVERSATION RUNS ON DELAY</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">round-trip light-time — send, then wait for the echo</text>
    <line x1="300" y1="220" x2="300" y2="760" stroke="rgba(127,176,224,0.14)" stroke-width="1.6"/>
    <circle cx="300" cy="250" r="7" fill="#ffffff"/> <text x="330" y="246" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">MOON</text> <text x="330" y="272" font-size="16" text-anchor="start" fill="#cfe3fb" letter-spacing="1">≈ 2.6 seconds</text><circle cx="300" cy="350" r="7" fill="#ffffff"/> <text x="330" y="346" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">MARS</text> <text x="330" y="372" font-size="16" text-anchor="start" fill="#cfe3fb" letter-spacing="1">≈ 6–44 minutes</text><circle cx="300" cy="450" r="7" fill="#ffffff"/> <text x="330" y="446" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">JUPITER</text> <text x="330" y="472" font-size="16" text-anchor="start" fill="#cfe3fb" letter-spacing="1">≈ 1.4 hours</text><circle cx="300" cy="550" r="7" fill="#ffffff"/> <text x="330" y="546" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">SATURN</text> <text x="330" y="572" font-size="16" text-anchor="start" fill="#cfe3fb" letter-spacing="1">≈ 2.6 hours</text><circle cx="300" cy="660" r="7" fill="#ffd27f"/> <text x="330" y="656" font-size="20" text-anchor="start" fill="#ffd27f" letter-spacing="1">VOYAGER 1</text> <text x="330" y="682" font-size="16" text-anchor="start" fill="#cfe3fb" letter-spacing="1">≈ 45 hours</text>
    <text x="760" y="800" font-size="18" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">you do not fly the craft — you write it a letter and hope</text>
