    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">THE PARADOX OF LEAVING</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">is it ever rational to depart? — the “wait calculation”</text>
    <line x1="200" y1="720" x2="1440" y2="720" stroke="rgba(127,176,224,0.14)" stroke-width="1.6"/>
    <circle cx="240" cy="620" r="8" fill="#7fb0e0"/> <text x="240" y="600" font-size="14" text-anchor="start" fill="#7fb0e0" letter-spacing="1">LAUNCH NOW</text>
    <path d="M 240 620 L 1300 480" fill="none" stroke="#7fb0e0" stroke-width="3"/>
    <text x="900" y="520" font-size="15" text-anchor="start" fill="#7fb0e0" letter-spacing="1">the slow ship</text>
    <circle cx="620" cy="660" r="8" fill="#ffd27f"/> <text x="620" y="690" font-size="14" text-anchor="start" fill="#ffd27f" letter-spacing="1">LAUNCH LATER</text>
    <path d="M 620 660 L 1300 300" fill="none" stroke="#ffd27f" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="1010" y="380" font-size="15" text-anchor="start" fill="#ffd27f" letter-spacing="1">a faster ship, launched centuries on</text>
    <circle cx="1300" cy="300" r="10" fill="#ffd27f"/>
    <text x="1160" y="250" font-size="15" text-anchor="middle" fill="#ffd27f" letter-spacing="1">arrives first</text>
    <text x="800" y="800" font-size="18" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">set out too early and a later, faster ship overtakes you — so when do you go?</text>
  </g></svg>