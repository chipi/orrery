    <text x="1180" y="428" font-size="16" text-anchor="start" fill="#ffd27f" letter-spacing="1">wait two years</text>
    <text x="1180" y="520" font-size="16" text-anchor="start" fill="#cfe3fb" letter-spacing="1">once you go,</text>
    <text x="1180" y="548" font-size="16" text-anchor="start" fill="#e08a6a" letter-spacing="1">there is no turning back</text>
