    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">YOU LEAVE ON THE UNIVERSE’S SCHEDULE</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">the launch window opens only when the planets line up — every ~26 months</text>
