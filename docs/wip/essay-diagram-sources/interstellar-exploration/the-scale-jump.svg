    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">A DIFFERENT KIND OF FAR</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">the solar system is measured in light-HOURS; the nearest star, in light-YEARS</text>
