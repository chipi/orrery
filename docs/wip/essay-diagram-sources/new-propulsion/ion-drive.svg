    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">THE SLOW PUSH WINS THE LONG RACE</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">ion drive — a breath of thrust, held for years</text>
    <g stroke="rgba(127,176,224,0.14)" stroke-width="1.4"><line x1="240" y1="700" x2="1400" y2="700"/><line x1="240" y1="700" x2="240" y2="220"/></g>
    <text x="150" y="460" font-size="16" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">SPEED</text>
    <text x="1320" y="740" font-size="16" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">time →</text>
    <!-- chemical: big jump then flat -->
    <path d="M 240 700 L 300 360 L 1400 300" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="1120" y="288" font-size="16" text-anchor="start" fill="#ffffff" letter-spacing="1">CHEMICAL — one shove, then coast</text>
    <!-- ion: slow linear climb crossing above -->
    <path d="M 240 700 C 600 660, 1000 470, 1400 230" fill="none" stroke="#7fb0e0" stroke-width="3"/>
    <text x="1160" y="235" font-size="16" text-anchor="start" fill="#7fb0e0" letter-spacing="1">ION — gentle, relentless</text>
    <circle cx="1030" cy="372" r="9" fill="#ffd27f"/> <text x="1030" y="352" font-size="15" text-anchor="middle" fill="#ffd27f" letter-spacing="1">it passes chemical, and never looks back</text>
    <text x="760" y="780" font-size="18" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">a gram of push, never switched off, beats a giant shove that ends</text>
  </g></svg>