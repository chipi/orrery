    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">HOW HARD EACH ENGINE THROWS</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">efficiency (specific impulse) — seconds; higher means less fuel for the same push</text>
    <rect x="360" y="274" width="300" height="34" rx="6" fill="rgba(127,176,224,0.16)" stroke="#ffffff" stroke-width="2"/><text x="350" y="298" font-size="18" text-anchor="end" fill="#ffffff" letter-spacing="1">CHEMICAL</text><text x="372" y="298" font-size="13" text-anchor="start" fill="rgba(207,227,251,0.7)" letter-spacing="1">the century-old ceiling</text><text x="680" y="298" font-size="17" text-anchor="start" fill="#ffffff" letter-spacing="1">≈ 450 s</text><rect x="360" y="374" width="560" height="34" rx="6" fill="rgba(127,176,224,0.16)" stroke="#7fb0e0" stroke-width="2"/><text x="350" y="398" font-size="18" text-anchor="end" fill="#7fb0e0" letter-spacing="1">NUCLEAR-THERMAL</text><text x="372" y="398" font-size="13" text-anchor="start" fill="rgba(207,227,251,0.7)" letter-spacing="1">heat, not flame</text><text x="940" y="398" font-size="17" text-anchor="start" fill="#7fb0e0" letter-spacing="1">≈ 900 s</text><rect x="360" y="474" width="900" height="34" rx="6" fill="rgba(127,176,224,0.16)" stroke="#7fb0e0" stroke-width="2"/><text x="350" y="498" font-size="18" text-anchor="end" fill="#7fb0e0" letter-spacing="1">ION DRIVE</text><text x="372" y="498" font-size="13" text-anchor="start" fill="rgba(207,227,251,0.7)" letter-spacing="1">the slow push</text><text x="1280" y="498" font-size="17" text-anchor="start" fill="#7fb0e0" letter-spacing="1">≈ 3,000+ s</text><rect x="360" y="574" width="1200" height="34" rx="6" fill="rgba(127,176,224,0.16)" stroke="#ffd27f" stroke-width="2"/><text x="350" y="598" font-size="18" text-anchor="end" fill="#ffd27f" letter-spacing="1">SOLAR SAIL</text><text x="372" y="598" font-size="13" text-anchor="start" fill="rgba(207,227,251,0.7)" letter-spacing="1">no propellant at all</text><text x="1580" y="598" font-size="17" text-anchor="start" fill="#ffd27f" letter-spacing="1">∞</text>
