    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">THE SAME ANSWER NEVER WORKS TWICE</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">how much air a world has decides how you are allowed to land</text>
