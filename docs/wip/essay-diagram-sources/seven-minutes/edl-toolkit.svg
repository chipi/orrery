letter-spacing="1">just a parachute, and patience</text>
    <text x="760" y="620" font-size="18" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">thin air → carry your own brakes;  thick air → let the sky do the work</text>
    <text x="760" y="800" font-size="18" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">every arrival is a different physics problem, solved from scratch</text>
