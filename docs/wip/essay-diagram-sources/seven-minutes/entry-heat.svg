    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">ALL THAT SPEED HAS TO GO SOMEWHERE</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">entry — a spacecraft arrives moving faster than a bullet, and the air turns it to fire</text>
    <path d="M 1360 240 Q 1500 320 1560 500" fill="none" stroke="rgba(127,176,224,0.14)" stroke-width="2"/>
    <text x="1420" y="300" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">top of</text> <text x="1420" y="322" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">atmosphere</text>
    <!-- capsule -->
    <g transform="translate(560,470) rotate(-25)">
      <path d="M -60 -70 L 60 -70 L 20 40 A 60 60 0 0 1 -20 40 Z" fill="rgba(127,176,224,0.16)" stroke="#cfe3fb" stroke-width="2.5"/>
      <path d="M -20 40 A 60 60 0 0 0 20 40" fill="#ffd27f" opacity="0.9"/>
    </g>
    <!-- plasma sheath -->
    <g stroke="#ffd27f" stroke-width="2" opacity="0.85">
      <path d="M 640 520 q 120 40 260 30"/><path d="M 650 560 q 140 60 300 60"/><path d="M 660 480 q 120 20 250 0"/>
    </g>
    <text x="980" y="560" font-size="16" text-anchor="start" fill="#ffd27f" letter-spacing="1">plasma — hotter than the Sun’s surface</text>
    <text x="470" y="610" font-size="16" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">HEAT SHIELD takes the fire</text>
    <text x="300" y="300" font-size="22" text-anchor="start" fill="#ffffff" letter-spacing="1">~20,000 km/h</text>
    <text x="300" y="330" font-size="15" text-anchor="start" fill="#cfe3fb" letter-spacing="1">converted to heat, on purpose</text>
    <text x="760" y="800" font-size="18" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">you do not slow down gently — you burn the speed off</text>
  </g></svg>