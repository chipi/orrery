    <text x="80" y="90" font-size="30" text-anchor="start" fill="#7fb0e0" letter-spacing="1">WHAT BANDWIDTH CANNOT FIX</text>
    <text x="80" y="128" font-size="20" text-anchor="start" fill="#cfe3fb" letter-spacing="1">more bits per second, yes — but never less delay</text>
    <circle cx="300" cy="470" r="36" fill="#4a6a9a"/> <text x="300" y="540" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">EARTH</text>
    <g stroke="rgba(127,176,224,0.14)" stroke-width="1.6" stroke-dasharray="8 8"><line x1="360" y1="470" x2="1220" y2="470"/></g>
    <circle cx="1280" cy="470" r="22" fill="#e08a6a"/> <text x="1280" y="540" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">MARS</text>
    <text x="790" y="435" font-size="17" text-anchor="middle" fill="#ffd27f" letter-spacing="1">3–22 light-MINUTES each way — always</text>
    <text x="790" y="640" font-size="16" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">a bigger pipe carries more of the story,</text>
    <text x="790" y="666" font-size="16" text-anchor="middle" fill="#ffd27f" letter-spacing="1">but the news still leaves minutes ago</text>
    <text x="790" y="800" font-size="18" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">no bandwidth on Earth buys a real-time conversation with another planet</text>
  </g></svg>