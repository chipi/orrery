# nginx.conf for the orrery web container (ADR-063).
#
# Serves the SvelteKit adapter-static bundle from /usr/share/nginx/html.
# The `/data/` path is the integration seam with the pipeline-runner
# container (ADR-065) — files there are mounted from the orrery-data
# named volume and must be served with `Cache-Control: no-cache` so
# pipeline refreshes propagate on the next request. Hashed assets under
# `/_app/immutable/` get the standard immutable-cache treatment.

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Access logs → stdout so the observability agent (docker_sd tails
  # container stdout/stderr) ships them to VictoriaLogs. Without this,
  # nginx logs to /var/log/nginx/access.log inside the container and the
  # agent only sees stderr. error_log stays on stderr (nginx default).
  access_log /dev/stdout;

  # Compression strategy (GH #273 / W3):
  #
  # The vite build emits .br + .gz siblings for every text-ish asset
  # via vite-plugin-compression2. *_static directives let nginx serve
  # the pre-built siblings when the client's Accept-Encoding allows
  # (zero CPU cost — it's a file-existence lookup):
  #   • brotli_static on — serves foo.br when client sent br
  #   • gzip_static on   — serves foo.gz when client sent gzip
  #
  # Live (on-the-fly) brotli is NOT enabled. An earlier attempt with
  # `brotli on; brotli_comp_level 5;` tipped docker-e2e past the 45-min
  # cap on all 3 legs (W4 commit 083fb33): the /data/ volume holds
  # pipeline-written JSON without pre-compressed siblings, so every
  # /data/*.json request re-compressed on the fly. Playwright making
  # 100s of those requests across 370 specs contended for CPU with the
  # browser. Live gzip stays on (original behaviour, much cheaper than
  # brotli at the same level) — sufficient for the dynamic data path.
  #
  # The brotli module loads via /etc/nginx/modules/*.conf, installed
  # by `apk add nginx-mod-http-brotli` in ops/docker/Dockerfile.web.
  brotli_static on;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/wasm
    application/xml
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/plain
    text/xml;

  # PWA manifest mime type. We have to re-include the default mime.types
  # FIRST because a bare `types {}` block replaces them wholesale — that's
  # how `.json` lost its application/json mapping in an earlier draft.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  # Hashed-asset bundle: filename encodes the version, cache for a year.
  # TIER 1 — fingerprinted / content-hashed (the content hash is in the filename,
  # so a changed file is a new URL). Cache forever. (Caching contract #387.)
  location ^~ /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # TIER 2 — stable-path content assets (the RFC-030 image ladder + audio).
  # The URL stays constant when the underlying file is swapped (the ladder
  # manifest, provenance, and srcset all key on the stable /images/<stem> path),
  # so these CANNOT be immutable — they need cheap revalidation. ETag (nginx
  # default) turns a swapped file into a 304 on the next request;
  # stale-while-revalidate serves the cached copy instantly and refreshes in the
  # background (the mobile SW already runs StaleWhileRevalidate for images, so
  # on-device stale images self-heal on next view). No CORS header: these are
  # served via <img srcset>, which does not need it — the cross-origin fetch()es
  # (ladder manifest, locale bundles) live under /data/ below. (Contract #387.)
  location ~* ^/(images|audio)/ {
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    try_files $uri =404;
  }

  # The integration seam with pipeline writes. Pipelines update the
  # orrery-data volume in place; nginx must not lie about freshness or
  # the PWA SW's NetworkFirst strategy can't catch refreshes. CORS
  # header is open because the PWA SW fetches with credentials='omit'
  # and the bundle and data share an origin in prod anyway — the
  # header is defence-in-depth for future cross-origin scenarios.
  location /data/ {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Service worker must never be cached or browsers won't pick up new
  # versions. Same posture as the GH Pages deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # PWA manifest — tiny file, no-cache so we can roll out icon/theme
  # changes without 24h CDN tail.
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # adapter-static SPA fallback. The static adapter writes one .html
  # file per route at the root (e.g. /missions.html, /missions/launches.html,
  # /de.html for the German landing), NOT directories with index.html.
  #
  # Trailing-slash handling: when a URL ends with `/`, $uri keeps the
  # slash and `$uri.html` resolves to e.g. `/de/.html` which doesn't
  # exist, so the chain falls through to `/index.html` (the en-US root)
  # — that masked /de/ as the en-US landing for months until
  # landing.spec.ts:79 caught it in docker-e2e on 2026-06-16. The
  # `rewrite … last` strips one trailing slash internally so `/de/`
  # becomes `/de`, $uri.html resolves to `/de.html`, and the German
  # landing is served. The regex requires at least one path char before
  # the trailing slash, so `/` itself is untouched.
  #
  # Order:
  #   1. $uri              — exact file (covers /index.html, /sw.js, …)
  #   2. $uri.html         — emitted-route case (/missions → /missions.html)
  #   3. $uri/index.html   — future directory-index routes
  #   4. /index.html       — SPA fallback for unknown routes
  location / {
    rewrite ^/(.+)/$ /$1 last;
    try_files $uri $uri.html $uri/index.html /index.html;
  }

  # Disable directory listing (defence-in-depth; we don't enable
  # autoindex anywhere, but state it explicitly).
  autoindex off;

  # Hide nginx version in headers + error pages.
  server_tokens off;

  # Security headers. Server-level add_header is inherited by `location /`
  # (the HTML SPA fallback) because that block defines no add_header of its
  # own. Asset locations (/_app/immutable/, /data/, /sw.js,
  # /manifest.webmanifest) shadow these with their own Cache-Control headers
  # — that's fine: browser-enforced CSP only applies to navigation (HTML)
  # responses, not to subresources.
  #
  # OWNERSHIP SPLIT (fixes duplicate/conflicting headers on prod — the
  # `validate-prod` X-Content-Type-Options failure, 2026-07-27):
  # The public Caddy edge sets the FLEET-WIDE baseline headers via the
  # `import hardened` snippet (podcast-infra `(hardened)`, ADR-114 §3):
  # Strict-Transport-Security, X-Frame-Options: DENY, X-Content-Type-Options:
  # nosniff, Referrer-Policy. This nginx therefore MUST NOT set those too, or
  # every public response carries each header twice (Caddy + nginx) and
  # X-Frame-Options conflicts (edge DENY vs the old nginx SAMEORIGIN). We drop
  # them here and let the edge own them (its DENY is stricter than the old
  # SAMEORIGIN, and matches our own CSP `frame-ancestors 'none'`).
  # CSP stays app-side: the edge deliberately sets NO CSP (it needs a
  # per-SPA audit), so it is ours to own.
  #
  # CSP rationale:
  # - script-src 'unsafe-inline' because SvelteKit's adapter-static
  #   ships hydration data as an inline `<script>` in the SSG output
  #   (`__sveltekit_*` bootstrap). Without 'unsafe-inline' the page
  #   renders from SSG but JS never hydrates — every button is dead
  #   chrome and docker-e2e cascades on every JS-driven assertion
  #   (audio toggle, locale switch, panel-open, hotspot cycle…). The
  #   per-build hash isn't stable enough to hard-code; the right
  #   future hardening is SvelteKit `kit.csp: { mode: 'hash' }` paired
  #   with nginx sub_filter to mirror the meta-tag hashes here.
  #   Tracked in #266 follow-up. analytics.orrerylearn.com is the only
  #   third-party script (the self-hosted Umami tracker, loaded by
  #   analytics.ts only when PUBLIC_UMAMI_* is baked into the build).
  # - style-src 'unsafe-inline' because Svelte scoped styles and KaTeX
  #   output ship as inline style attributes. Future hardening: nonces.
  # - img-src allows https: (Orrery pulls agency imagery from many CDNs).
  # - connect-src allows *.sentry.io (legacy) + telemetry.orrerylearn.com (the
  #   self-hosted GlitchTip ingest edge — the client Sentry SDK POSTs browser
  #   errors there; without it the browser blocks the POST with a CSP violation,
  #   which no edge/CORS test catches since CSP is enforced page-side before the
  #   request is sent) + analytics.orrerylearn.com (the self-hosted Umami
  #   /api/send collect endpoint, same page-side-enforcement reasoning).
  # - frame-src / media-src allow the click-to-load video embeds (RFC-033
  #   linked-video layer). Without frame-src (or child-src), iframes fall back
  #   to default-src 'self' and the browser BLOCKS the youtube-nocookie / vimeo
  #   player — the exact reason gallery videos failed to load on the VPS while
  #   GH Pages (which sets no CSP) worked. All shipped video entries are
  #   youtube-nocookie today; vimeo + agency <video> (media-src) are added
  #   defensively since MediaPlayer supports them. Poster stills use img-src
  #   (already https:). See src/lib/video-provenance.ts embedUrlFor.
  # - frame-ancestors 'none' is the modern X-Frame-Options equivalent and is
  #   the app-side clickjacking defense; the edge additionally sends
  #   X-Frame-Options: DENY for legacy browsers (see OWNERSHIP SPLIT above —
  #   X-Frame-Options / X-Content-Type-Options / Referrer-Policy are NOT set
  #   here on purpose; the Caddy edge owns them fleet-wide).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.orrerylearn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.sentry.io https://telemetry.orrerylearn.com https://analytics.orrerylearn.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; media-src 'self' https: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'" always;
}
