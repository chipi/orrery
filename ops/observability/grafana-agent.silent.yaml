# Silent-mode Grafana Agent config (RFC-025 / ADR-068).
#
# Used by ops/observability/agent-entrypoint.sh when GRAFANA_CLOUD_*
# env vars are unset. The agent starts, exposes its HTTP server on
# :12345, and... does literally nothing else. No log shipping, no
# metrics scraping, no Docker socket access.
#
# Confirm silence with:
#   docker logs orrery-grafana-agent
#     → "[agent-entrypoint] Grafana Cloud creds NOT present → silent mode"
#     → no further output
#   lsof -p $(docker inspect -f '{{.State.Pid}}' orrery-grafana-agent) | grep TCP
#     → only the local listener on :12345 (no outbound)

server:
  log_level: warn
