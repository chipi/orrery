# Grafana Agent config for the Orrery docker stack (RFC-025 / ADR-068).
#
# Ships Docker container logs for `orrery-web` and any
# `orrery-pipeline-runner-*` containers to the self-hosted VictoriaLogs on
# the homelab (tailnet-only), Loki push protocol. Emit-open-formats /
# ship-pluggably — see homelab docs/wip/orrery-o11y-handover.md. All three
# environments ship to the same backend; the `env` label (dev / staging /
# prod) slices them. Profile-gated by docker-compose; this file only loads
# when `docker compose --profile observability up` is invoked.
#
# Silent default: if GRAFANA_CLOUD_LOKI_URL is empty the entrypoint swaps in
# the silent config and the agent never sends a byte upstream. Confirm with:
#   docker exec orrery-grafana-agent ss -tn
# should report zero established outbound connections.

server:
  log_level: warn

# Logs subsystem only — no metrics scraping today (Orrery has no
# /metrics endpoint until the future nginx-prometheus-exporter sidecar).
# The `metrics:` block would live alongside `logs:` once we have
# something to scrape.
logs:
  configs:
    - name: orrery
      clients:
        # VictoriaLogs (homelab, tailnet-only). No auth on the tailnet, so
        # no basic_auth — unlike the retired Grafana Cloud target. The
        # push path is Loki-compatible: /insert/loki/api/v1/push.
        - url: ${GRAFANA_CLOUD_LOKI_URL}
          # Labels attached to every log stream. `env` slices
          # dev (local) / staging (GitHub) / prod (VPS) onto one stack.
          external_labels:
            env: ${GRAFANA_AGENT_ENV}
            app: orrery
      positions:
        filename: /tmp/positions.yaml
      scrape_configs:
        - job_name: orrery-docker
          # docker_sd_configs uses the Docker socket to discover
          # containers; new pipeline-runner invocations get picked up
          # within `refresh_interval`. Read-only mount on the agent
          # side (see docker-compose.yml).
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 30s
          relabel_configs:
            # Restrict to Orrery containers. Without this we'd ship
            # logs from every container on the host — fine on the
            # single-purpose VPS, wrong on a laptop running other
            # docker-compose projects.
            - source_labels: ['__meta_docker_container_name']
              regex: '/(orrery-web|orrery-pipeline-runner-.*)'
              action: keep
            # surface: web (nginx access/error) vs pipeline (data runners).
            # Mirrors the podcast player/pipeline split so the two orrery
            # surfaces are differentiable in queries.
            - source_labels: ['__meta_docker_container_name']
              regex: '/orrery-web'
              target_label: surface
              replacement: 'web'
            - source_labels: ['__meta_docker_container_name']
              regex: '/orrery-pipeline-runner-.*'
              target_label: surface
              replacement: 'pipeline'
            # Pretty container label for queries — strip the leading
            # slash docker prepends.
            - source_labels: ['__meta_docker_container_name']
              target_label: container
              regex: '/(.*)'
              replacement: '$1'
            - source_labels: ['__meta_docker_container_log_stream']
              target_label: stream
