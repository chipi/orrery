    <text x="80" y="88" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">ASCENT GUIDANCE — OPEN-LOOP → PEG</text><text x="80" y="124" font-size="18" text-anchor="start" fill="#cfe3fb" letter-spacing="1">a fixed pitch program through the air; a closed-loop solver to the exact orbit above it</text>
    <!-- ground + pad -->
    <line x1="140" y1="800" x2="900" y2="800" stroke="#7fb0e0" stroke-width="2"/>
    <text x="150" y="828" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">PAD</text>
    <!-- atmosphere band -->
    <rect x="140" y="560" width="1320" height="240" fill="rgba(127,176,224,0.05)"/>
    <line x1="140" y1="560" x2="1460" y2="560" stroke="#cfe3fb" stroke-width="1.2" stroke-dasharray="7 9" opacity="0.7"/>
    <text x="150" y="545" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">TOP OF SENSIBLE ATMOSPHERE</text>
    <!-- ascent arc: vertical → gravity turn → pitch over to horizontal -->
    <path d="M 240 800 Q 260 640 360 560 Q 620 380 1120 300 Q 1280 288 1380 300" fill="none" stroke="#ffd27f" stroke-width="3.4"/>
    <g stroke="#ffd27f" stroke-width="3" fill="#ffd27f"><line x1="1330" y1="296" x2="1382" y2="300"/><polygon points="1382,300 1369,304 1370,294"/></g>
    <!-- open-loop segment marker (in atmosphere) -->
    <circle cx="240" cy="800" r="7" fill="#ffffff"/> <text x="300" y="720" font-size="13" text-anchor="start" fill="#cfe3fb" letter-spacing="1">liftoff + pitch-over kick</text>
    <text x="300" y="630" font-size="15" text-anchor="start" fill="#cfe3fb" letter-spacing="1">OPEN-LOOP pitch program</text>
    <text x="300" y="654" font-size="13" text-anchor="start" fill="#cfe3fb" letter-spacing="1">(gravity turn, α ≈ 0, low loads)</text>
    <!-- closed-loop segment (above atmosphere) -->
    <circle cx="360" cy="560" r="7" fill="#e08a6a"/> <text x="420" y="540" font-size="13" text-anchor="start" fill="#e08a6a" letter-spacing="1">handover</text>
    <text x="700" y="430" font-size="16" text-anchor="start" fill="#ffd27f" letter-spacing="1">CLOSED-LOOP PEG</text>
    <text x="700" y="456" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">re-solve steering to cutoff every second</text>
    <text x="700" y="480" font-size="13" text-anchor="start" fill="#cfe3fb" letter-spacing="1">(linear-tangent law + time-to-go)</text>
    <!-- cutoff condition -->
    <circle cx="1380" cy="300" r="8" fill="#ffffff"/>
    <text x="1362" y="258" font-size="14" text-anchor="end" fill="#ffd27f" letter-spacing="1">CUTOFF — horizontal,</text>
    <text x="1362" y="282" font-size="14" text-anchor="end" fill="#ffd27f" letter-spacing="1">orbital speed 7.8 km/s</text>
    <text x="810" y="872" font-size="16" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">a per-second boundary-value problem — why spaceflight needed the onboard computer</text>
  </g></svg>