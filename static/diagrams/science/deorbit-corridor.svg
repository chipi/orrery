    <text x="80" y="88" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">DEORBIT &amp; THE RE-ENTRY CORRIDOR</text>
    <text x="80" y="124" font-size="18" text-anchor="start" fill="#cfe3fb" letter-spacing="1">a retrograde burn drops perigee into the air — then the entry angle decides everything</text>
    <!-- Earth limb bottom-right -->
    <path d="M -100 1050 A 1300 1300 0 0 1 1750 780" fill="rgba(127,176,224,0.06)" stroke="#7fb0e0" stroke-width="2.2"/>
    <text x="1300" y="860" font-size="18" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">EARTH</text>
    <!-- entry interface line -->
    <path d="M 250 560 A 1500 1500 0 0 1 1520 470" fill="none" stroke="#cfe3fb" stroke-width="1.2" stroke-dasharray="7 8" opacity="0.7"/>
    <text x="300" y="545" font-size="15" text-anchor="start" fill="#cfe3fb" letter-spacing="1">ENTRY INTERFACE  ~122 km</text>
    <!-- orbit + capsule + retro burn -->
    <path d="M 180 300 A 900 900 0 0 1 900 210" fill="none" stroke="#7fb0e0" stroke-width="1.6" opacity="0.8"/>
    <circle cx="360" cy="262" r="9" fill="#ffffff"/> <text x="360" y="240" font-size="14" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">capsule in orbit</text>
    <g stroke="#ffd27f" stroke-width="3" fill="#ffd27f"><line x1="360" y1="262" x2="250" y2="285"/><polygon points="250,285 262,277 264,288"/></g>
    <text x="230" y="320" font-size="14" text-anchor="start" fill="#ffd27f" letter-spacing="1">retrograde burn  ~100 m/s</text>
    <!-- three trajectories from a shared entry point -->
    <!-- shallow / skip-out -->
    <path d="M 560 505 Q 820 470 1120 300" fill="none" stroke="#e08a6a" stroke-width="2.6" stroke-dasharray="10 7"/>
    <g stroke="#e08a6a" stroke-width="2.6" fill="#e08a6a"><line x1="1060" y1="340" x2="1130" y2="292"/><polygon points="1130,292 1122,304 1116,295"/></g>
    <text x="1140" y="300" font-size="16" text-anchor="start" fill="#e08a6a" letter-spacing="1">TOO SHALLOW → skips back to space</text>
    <!-- safe corridor -->
    <path d="M 560 505 Q 840 620 1030 815" fill="none" stroke="#ffd27f" stroke-width="3.4"/>
    <text x="1050" y="800" font-size="17" text-anchor="start" fill="#ffd27f" letter-spacing="1">SURVIVABLE CORRIDOR</text>
    <text x="1050" y="826" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">steep enough not to skip,</text>
    <text x="1050" y="848" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">shallow enough to survive</text>
    <!-- steep / burn-up -->
    <path d="M 560 505 Q 640 640 700 830" fill="none" stroke="#e08a6a" stroke-width="2.6"/>
    <text x="560" y="700" font-size="16" text-anchor="end" fill="#e08a6a" letter-spacing="1">TOO STEEP</text>
    <text x="560" y="724" font-size="13" text-anchor="end" fill="#e08a6a" letter-spacing="1">peak-g &amp; heating</text>
    <text x="560" y="744" font-size="13" text-anchor="end" fill="#e08a6a" letter-spacing="1">exceed limits</text>
    <circle cx="560" cy="505" r="8" fill="#ffffff"/>
    <!-- FPA callout -->
    <path d="M 560 505 l 150 22" stroke="#cfe3fb" stroke-width="1.2" opacity="0.6"/>
    <text x="600" y="560" font-size="15" text-anchor="start" fill="#cfe3fb" letter-spacing="1">entry flight-path angle γ</text>
    <text x="600" y="582" font-size="13" text-anchor="start" fill="#cfe3fb" letter-spacing="1">corridor &lt; 2° wide for lunar return</text>
    <text x="800" y="878" font-size="16" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">LEO ballistic entry ≈ 8 g   ·   Apollo lifting entry ≈ 6–7 g</text>
  </g></svg>