    <text x="80" y="88" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">THE LANDING FOOTPRINT</text><text x="80" y="124" font-size="18" text-anchor="start" fill="#cfe3fb" letter-spacing="1">lift gives a reachable AREA on the ground — far targets cost low g, near targets high g</text>
    <!-- ground baseline -->
    <line x1="140" y1="720" x2="1480" y2="720" stroke="#7fb0e0" stroke-width="2"/>
    <text x="150" y="748" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">GROUND TRACK  (downrange →)</text>
    <!-- entry point up-left -->
    <circle cx="300" cy="250" r="9" fill="#ffffff"/> <text x="300" y="228" font-size="14" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">entry interface</text>
    <!-- lift-up long/low-g trajectory -->
    <path d="M 300 250 Q 760 360 1240 720" fill="none" stroke="#ffd27f" stroke-width="3.2"/>
    <g stroke="#ffd27f" stroke-width="3" fill="#ffd27f"><line x1="1200" y1="660" x2="1242" y2="720"/><polygon points="1242,720 1230,713 1239,706"/></g>
    <text x="820" y="400" font-size="15" text-anchor="start" fill="#ffd27f" letter-spacing="1">LIFT-UP → far edge, LOW peak-g</text>
    <!-- lift-down short/high-g trajectory -->
    <path d="M 300 250 Q 430 500 560 720" fill="none" stroke="#e08a6a" stroke-width="3"/>
    <g stroke="#e08a6a" stroke-width="3" fill="#e08a6a"><line x1="540" y1="660" x2="560" y2="720"/><polygon points="560,720 551,709 561,706"/></g>
    <text x="360" y="560" font-size="15" text-anchor="start" fill="#e08a6a" letter-spacing="1">LIFT-DOWN</text>
    <text x="360" y="584" font-size="13" text-anchor="start" fill="#e08a6a" letter-spacing="1">near edge, HIGH g</text>
    <!-- the footprint teardrop on the ground -->
    <path d="M 560 720 Q 800 686 1240 720 Q 900 758 560 720 Z" fill="rgba(255,210,127,0.10)" stroke="#ffd27f" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="900" y="704" font-size="14" text-anchor="middle" fill="#ffd27f" letter-spacing="1">FOOTPRINT — reachable band</text>
    <!-- crossrange arrows -->
    <g stroke="#cfe3fb" stroke-width="1.8" fill="#cfe3fb"><line x1="900" y1="720" x2="900" y2="660"/><polygon points="900,660 905,673 895,673"/></g> <g stroke="#cfe3fb" stroke-width="1.8" fill="#cfe3fb"><line x1="900" y1="720" x2="900" y2="780"/><polygon points="900,780 895,767 905,767"/></g>
    <text x="920" y="664" font-size="13" text-anchor="start" fill="#cfe3fb" letter-spacing="1">crossrange (bank sideways)</text>
    <!-- target -->
    <circle cx="1020" cy="720" r="8" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="2"><line x1="1006" y1="720" x2="1034" y2="720"/><line x1="1020" y1="706" x2="1020" y2="734"/></g>
    <text x="1020" y="806" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">TARGET — guidance solves the bank schedule to land here</text>
    <text x="810" y="872" font-size="16" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">outside the footprint → unreachable; guidance clamps to the nearest edge</text>
  </g></svg>