<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Direct imaging: a coronagraph masks the overwhelming glare of the star so the faint neighbouring planet can be photographed.">
  <style>
    .stroke{stroke:rgba(255,255,255,0.85);stroke-width:1.5;fill:none}
    .dashed{stroke:rgba(255,255,255,0.3);stroke-width:1;stroke-dasharray:4 3;fill:none}
    .accent{stroke:#4ecdc4;stroke-width:2.4;fill:none}
    .accentf{fill:#4ecdc4}
    .star{fill:#ffc850;stroke:#ffc850;stroke-width:1}
    .body{fill:rgba(255,255,255,0.95)}
    .blue{fill:#5b8dd9;stroke:#5b8dd9}
    .red{fill:#d95b6b;stroke:#d95b6b}
    .label{fill:rgba(255,255,255,0.85);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
    .laccent{fill:#4ecdc4;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
    .lgold{fill:#ffc850;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
  </style>
  <text class="label" x="300" y="26" text-anchor="middle">DIRECT IMAGING</text>
  <circle cx="260" cy="170" r="70" fill="#ffc850" opacity="0.12"/>
  <circle cx="260" cy="170" r="42" fill="#ffc850" opacity="0.2"/>
  <circle class="star" cx="260" cy="170" r="20"/>
  <circle cx="260" cy="170" r="46" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="6"/>
  <text class="label" x="260" y="240" text-anchor="middle">coronagraph mask blocks the star</text>
  <circle class="accentf" cx="410" cy="140" r="6"/>
  <text class="laccent" x="426" y="144">planet (photographed directly)</text>
</svg>
