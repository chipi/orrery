<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Gravitational microlensing: a foreground star lenses a background one, brightening it; an orbiting planet adds a brief secondary spike.">
  <style>
    .stroke{stroke:rgba(255,255,255,0.85);stroke-width:1.5;fill:none}
    .dashed{stroke:rgba(255,255,255,0.3);stroke-width:1;stroke-dasharray:4 3;fill:none}
    .accent{stroke:#4ecdc4;stroke-width:2.4;fill:none}
    .accentf{fill:#4ecdc4}
    .star{fill:#ffc850;stroke:#ffc850;stroke-width:1}
    .body{fill:rgba(255,255,255,0.95)}
    .blue{fill:#5b8dd9;stroke:#5b8dd9}
    .red{fill:#d95b6b;stroke:#d95b6b}
    .label{fill:rgba(255,255,255,0.85);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
    .laccent{fill:#4ecdc4;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
    .lgold{fill:#ffc850;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
  </style>
  <text class="label" x="300" y="26" text-anchor="middle">GRAVITATIONAL MICROLENSING</text>
  <circle class="body" cx="90" cy="90" r="6"/>
  <text class="label" x="104" y="94">source (background star)</text>
  <circle class="star" cx="300" cy="90" r="10"/>
  <circle class="accentf" cx="322" cy="80" r="3"/>
  <text class="label" x="300" y="70" text-anchor="middle">lens star + planet</text>
  <path class="dashed" d="M90 90 q105 -30 210 0"/>
  <path class="dashed" d="M90 90 q105 30 210 0"/>
  <circle class="body" cx="520" cy="90" r="4"/>
  <text class="label" x="510" y="74" text-anchor="end">observer</text>
  <line class="stroke" x1="60" y1="300" x2="560" y2="300"/>
  <line class="stroke" x1="60" y1="200" x2="60" y2="300"/>
  <text class="label" x="40" y="210">mag</text>
  <path class="accent" d="M60 290 q120 0 180 -60 q30 -30 60 -30 q30 0 60 30 q60 60 180 60"/>
  <path class="accent" d="M296 210 l0 -34 l8 8" fill="#4ecdc4"/>
  <text class="laccent" x="300" y="168" text-anchor="middle">planet spike</text>
</svg>
