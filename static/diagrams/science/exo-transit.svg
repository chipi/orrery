<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Transit: a planet crosses in front of its star, blocking a fraction of light and producing a periodic dip in the measured brightness.">
  <style>
    .stroke{stroke:rgba(255,255,255,0.85);stroke-width:1.5;fill:none}
    .dashed{stroke:rgba(255,255,255,0.3);stroke-width:1;stroke-dasharray:4 3;fill:none}
    .accent{stroke:#4ecdc4;stroke-width:2.4;fill:none}
    .accentf{fill:#4ecdc4}
    .star{fill:#ffc850;stroke:#ffc850;stroke-width:1}
    .body{fill:rgba(255,255,255,0.95)}
    .blue{fill:#5b8dd9;stroke:#5b8dd9}
    .red{fill:#d95b6b;stroke:#d95b6b}
    .label{fill:rgba(255,255,255,0.85);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
    .laccent{fill:#4ecdc4;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
    .lgold{fill:#ffc850;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px}
  </style>
  <text class="label" x="300" y="26" text-anchor="middle">TRANSIT METHOD</text>
  <circle class="star" cx="300" cy="110" r="48"/>
  <line class="dashed" x1="180" y1="110" x2="420" y2="110"/>
  <circle class="body" cx="250" cy="110" r="10"/>
  <circle class="body" cx="330" cy="110" r="10" opacity="0.5"/>
  <path class="accentf" d="M330 96 l0 28" opacity="0.4"/>
  <text class="label" x="300" y="186" text-anchor="middle">planet crosses the disk</text>
  <line class="stroke" x1="70" y1="230" x2="70" y2="300"/>
  <line class="stroke" x1="70" y1="300" x2="540" y2="300"/>
  <text class="label" x="34" y="238">flux</text>
  <path class="accent" d="M70 250 h150 l20 30 h90 l20 -30 h150"/>
  <text class="laccent" x="300" y="296" text-anchor="middle">dip depth = (planet / star)² of area</text>
</svg>
