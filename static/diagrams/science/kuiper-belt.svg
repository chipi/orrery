<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="The Kuiper Belt as an icy disc beyond Neptune. Three populations labelled — classical KBOs at 42-48 AU, Plutinos in 2:3 resonance with Neptune, scattered disc extending toward the inner Oort. Largest members Pluto, Eris, Makemake, Haumea, Quaoar.">
  <style>
    .bg { fill: #0a0c1e; }
    .star { fill: rgba(255,255,255,0.45); }
    .dim-star { fill: rgba(255,255,255,0.2); }
    .neptune { fill: #4b6ca8; stroke: #7e9ad0; stroke-width: 0.6; }
    .pluto { fill: #c8aa84; stroke: #e5cca4; stroke-width: 0.8; }
    .charon { fill: #7e6e58; }
    .eris { fill: #d6d2c4; }
    .makemake { fill: #b59474; }
    .haumea { fill: #a5b1c4; }
    .quaoar { fill: #9094a8; }
    .kbo { fill: #9fc6e3; }
    .kbo-dim { fill: rgba(159,198,227,0.5); }
    .resonance { fill: none; stroke: rgba(255,212,123,0.5); stroke-width: 1; stroke-dasharray: 4 3; }
    .arrow { fill: none; stroke: #7e9ad0; stroke-width: 1.4; opacity: 0.55; }
    .arrow-head { fill: #7e9ad0; opacity: 0.55; }
    .label { font-family: 'Space Mono', monospace; font-size: 11px; fill: #d9dde7; letter-spacing: 1px; }
    .label-dim { font-family: 'Space Mono', monospace; font-size: 9px; fill: rgba(217,221,231,0.6); letter-spacing: 1px; }
    .eyebrow { font-family: 'Space Mono', monospace; font-size: 8px; fill: rgba(159,198,227,0.85); letter-spacing: 2px; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; fill: #fff; letter-spacing: 2.5px; }
    .au { font-family: 'Space Mono', monospace; font-size: 8px; fill: rgba(255,255,255,0.35); letter-spacing: 1px; }
    .pop-label { font-family: 'Space Mono', monospace; font-size: 9px; fill: rgba(159,198,227,0.9); letter-spacing: 1.5px; text-transform: uppercase; }
    .pop-band { fill: rgba(159,198,227,0.06); }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="320" />
  <!-- background starfield -->
  <circle class="star" cx="60" cy="40" r="1.1"/>
  <circle class="dim-star" cx="140" cy="80" r="0.9"/>
  <circle class="star" cx="220" cy="30" r="1"/>
  <circle class="dim-star" cx="300" cy="70" r="0.8"/>
  <circle class="dim-star" cx="370" cy="50" r="1"/>
  <circle class="star" cx="450" cy="40" r="0.9"/>
  <circle class="dim-star" cx="530" cy="80" r="0.9"/>
  <circle class="dim-star" cx="610" cy="50" r="1"/>
  <circle class="star" cx="680" cy="80" r="1.1"/>
  <circle class="dim-star" cx="40" cy="290" r="1"/>
  <circle class="star" cx="220" cy="280" r="0.9"/>
  <circle class="dim-star" cx="430" cy="285" r="0.8"/>
  <circle class="star" cx="610" cy="270" r="1"/>

  <!-- Title -->
  <text class="title" x="20" y="40">KUIPER BELT</text>
  <text class="eyebrow" x="20" y="60">30 – 50 AU · BEYOND NEPTUNE · ICY POPULATION</text>

  <!-- Population bands -->
  <rect class="pop-band" x="155" y="100" width="100" height="120"/>
  <rect class="pop-band" x="260" y="100" width="200" height="120"/>
  <rect class="pop-band" x="465" y="100" width="220" height="120"/>

  <!-- Neptune at left -->
  <line x1="120" y1="100" x2="120" y2="260" stroke="rgba(75,108,168,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle class="neptune" cx="120" cy="190" r="15"/>
  <text class="label" x="120" y="232" text-anchor="middle">NEPTUNE</text>
  <text class="au" x="120" y="246" text-anchor="middle">30 AU</text>

  <!-- Plutino population (2:3 resonance, ~39 AU) -->
  <text class="pop-label" x="205" y="115" text-anchor="middle">PLUTINOS</text>
  <text class="label-dim" x="205" y="128" text-anchor="middle">2:3 with Neptune</text>
  <circle class="pluto" cx="200" cy="180" r="6"/>
  <circle class="charon" cx="210" cy="172" r="2.5"/>
  <text class="label" x="200" y="200" text-anchor="middle">PLUTO + CHARON</text>
  <text class="label-dim" x="200" y="213" text-anchor="middle">39 AU</text>
  <!-- a few scattered Plutinos -->
  <circle class="kbo" cx="180" cy="155" r="1.4"/>
  <circle class="kbo-dim" cx="225" cy="150" r="1.2"/>
  <circle class="kbo" cx="240" cy="180" r="1.3"/>
  <circle class="kbo-dim" cx="175" cy="200" r="1.1"/>
  <circle class="kbo" cx="220" cy="210" r="1.4"/>

  <!-- Classical KBOs (42-48 AU, "cold disc") -->
  <text class="pop-label" x="360" y="115" text-anchor="middle">CLASSICAL KBOs</text>
  <text class="label-dim" x="360" y="128" text-anchor="middle">42 – 48 AU · cold disc</text>
  <g opacity="0.85">
    <circle class="kbo" cx="275" cy="160" r="1.5"/>
    <circle class="kbo-dim" cx="295" cy="175" r="1.3"/>
    <circle class="kbo" cx="310" cy="190" r="1.4"/>
    <circle class="kbo-dim" cx="330" cy="170" r="1.2"/>
    <circle class="kbo" cx="350" cy="200" r="1.5"/>
    <circle class="kbo-dim" cx="370" cy="175" r="1.3"/>
    <circle class="kbo" cx="390" cy="195" r="1.4"/>
    <circle class="kbo-dim" cx="410" cy="180" r="1.2"/>
    <circle class="kbo" cx="430" cy="210" r="1.5"/>
    <circle class="kbo-dim" cx="445" cy="170" r="1.3"/>
    <!-- second density pass -->
    <circle class="kbo-dim" cx="285" cy="195" r="1.0"/>
    <circle class="kbo-dim" cx="320" cy="155" r="1.0"/>
    <circle class="kbo-dim" cx="355" cy="155" r="1.0"/>
    <circle class="kbo-dim" cx="390" cy="160" r="1.0"/>
    <circle class="kbo-dim" cx="425" cy="180" r="1.0"/>
  </g>

  <circle class="quaoar" cx="345" cy="220" r="3.2"/>
  <text class="label-dim" x="345" y="238" text-anchor="middle">Quaoar</text>

  <circle class="makemake" cx="395" cy="220" r="3.5"/>
  <text class="label-dim" x="395" y="238" text-anchor="middle">Makemake</text>

  <circle class="haumea" cx="440" cy="220" r="3.5"/>
  <text class="label-dim" x="440" y="238" text-anchor="middle">Haumea</text>

  <!-- Scattered Disc (50+ AU) -->
  <text class="pop-label" x="570" y="115" text-anchor="middle">SCATTERED DISC</text>
  <text class="label-dim" x="570" y="128" text-anchor="middle">eccentric · 50 → 1000+ AU</text>
  <g opacity="0.7">
    <circle class="kbo-dim" cx="490" cy="170" r="1.2"/>
    <circle class="kbo-dim" cx="510" cy="190" r="1.3"/>
    <circle class="kbo-dim" cx="535" cy="160" r="1.1"/>
    <circle class="kbo-dim" cx="560" cy="200" r="1.2"/>
    <circle class="kbo-dim" cx="590" cy="170" r="1.3"/>
    <circle class="kbo-dim" cx="620" cy="195" r="1.1"/>
    <circle class="kbo-dim" cx="650" cy="160" r="1.2"/>
    <circle class="kbo-dim" cx="675" cy="200" r="1.0"/>
  </g>

  <circle class="eris" cx="540" cy="220" r="3.8"/>
  <text class="label-dim" x="540" y="238" text-anchor="middle">Eris</text>
  <text class="label-dim" x="540" y="250" text-anchor="middle">96 AU aphelion</text>

  <!-- Outflow arrow into Oort -->
  <g>
    <path class="arrow" d="M 670 195 L 705 175"/>
    <polygon class="arrow-head" points="705,175 695,176 700,183"/>
  </g>
  <text class="label-dim" x="710" y="195" text-anchor="end">→ Oort Cloud</text>

  <!-- Caption note -->
  <text class="eyebrow" x="700" y="60" text-anchor="end">DISCOVERED 1992 — JEWITT + LUU</text>
  <text class="label-dim" x="700" y="73" text-anchor="end">predicted 1951 by Gerard Kuiper</text>

  <!-- AU axis -->
  <line x1="120" y1="285" x2="690" y2="285" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text class="au" x="120" y="298" text-anchor="middle">30</text>
  <text class="au" x="200" y="298" text-anchor="middle">39</text>
  <text class="au" x="360" y="298" text-anchor="middle">45</text>
  <text class="au" x="500" y="298" text-anchor="middle">50</text>
  <text class="au" x="640" y="298" text-anchor="middle">75+</text>
  <text class="au" x="715" y="298" text-anchor="end">AU</text>
</svg>
