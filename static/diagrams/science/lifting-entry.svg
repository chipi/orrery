    <text x="80" y="88" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">LIFTING ENTRY — STEERING WITH BANK</text><text x="80" y="124" font-size="18" text-anchor="start" fill="#cfe3fb" letter-spacing="1">a capsule offsets its centre of mass to fly with a little lift; rolling aims it</text>
    <!-- capsule cross-section (left) with offset CG + lift vector -->
    <g transform="translate(360,470)">
      <path d="M -70 -78 L 70 -78 L 46 6 L -46 6 Z" fill="rgba(207,227,251,0.10)" stroke="#cfe3fb" stroke-width="2.4"/>
      <path d="M -46 6 Q 0 70 46 6 Z" fill="rgba(255,210,127,0.18)" stroke="#ffd27f" stroke-width="2.6"/>
      <circle cx="14" cy="-20" r="6" fill="#e08a6a"/> <text x="26" y="-16" font-size="13" text-anchor="start" fill="#e08a6a" letter-spacing="1">CG (offset)</text>
      <text x="0" y="96" font-size="13" text-anchor="middle" fill="#ffd27f" letter-spacing="1">HEAT SHIELD</text>
      <g stroke="#ffd27f" stroke-width="3" fill="#ffd27f"><line x1="0" y1="-8" x2="-74" y2="-70"/><polygon points="-74,-70 -61,-66 -68,-58"/></g>
      <text x="-96" y="-78" font-size="15" text-anchor="end" fill="#ffd27f" letter-spacing="1">LIFT</text>
      <g stroke="#7fb0e0" stroke-width="2.2" fill="#7fb0e0"><line x1="0" y1="-8" x2="6" y2="-108"/><polygon points="6,-108 11,-95 -0,-95"/></g>
      <text x="18" y="-104" font-size="13" text-anchor="start" fill="#cfe3fb" letter-spacing="1">velocity</text>
    </g>
    <text x="360" y="300" font-size="15" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">L/D ≈ 0.3 — small, but not zero</text>
    <!-- roll dial -->
    <g transform="translate(360,690)">
      <circle r="52" fill="none" stroke="#7fb0e0" stroke-width="1.6" opacity="0.7"/>
      <g stroke="#ffd27f" stroke-width="2.4" fill="#ffd27f"><line x1="0" y1="0" x2="0" y2="-50"/><polygon points="0,-50 5,-37 -5,-37"/></g>
      <g stroke="#cfe3fb" stroke-width="2" fill="#cfe3fb"><line x1="0" y1="0" x2="40" y2="-30"/><polygon points="40,-30 33,-18 26,-27"/></g>
      <text x="0" y="78" font-size="13" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">BANK ANGLE φ — the one control</text>
    </g>
    <!-- Earth limb + corridor (right) -->
    <path d="M 780 1080 A 1200 1200 0 0 1 1720 720" fill="rgba(127,176,224,0.06)" stroke="#7fb0e0" stroke-width="2.2"/>
    <text x="1500" y="900" font-size="16" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">EARTH</text>
    <path d="M 760 470 A 1400 1400 0 0 1 1560 420" fill="none" stroke="#cfe3fb" stroke-width="1.2" stroke-dasharray="7 8" opacity="0.7"/>
    <text x="800" y="452" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">ENTRY INTERFACE</text>
    <circle cx="900" cy="486" r="8" fill="#ffffff"/>
    <!-- lift-up: float, far, low-g -->
    <path d="M 900 486 Q 1180 470 1470 690" fill="none" stroke="#ffd27f" stroke-width="3.2"/>
    <g stroke="#ffd27f" stroke-width="3" fill="#ffd27f"><line x1="1420" y1="640" x2="1472" y2="692"/><polygon points="1472,692 1459,687 1467,679"/></g>
    <text x="1120" y="500" font-size="15" text-anchor="start" fill="#ffd27f" letter-spacing="1">LIFT-UP → stretch the glide,</text>
    <text x="1120" y="524" font-size="14" text-anchor="start" fill="#ffd27f" letter-spacing="1">low peak-g, land far</text>
    <!-- lift-down: steep, short, high-g -->
    <path d="M 900 486 Q 980 640 1030 850" fill="none" stroke="#e08a6a" stroke-width="2.8"/>
    <text x="940" y="720" font-size="15" text-anchor="start" fill="#e08a6a" letter-spacing="1">LIFT-DOWN</text>
    <text x="940" y="744" font-size="13" text-anchor="start" fill="#e08a6a" letter-spacing="1">steepen, high peak-g,</text>
    <text x="940" y="764" font-size="13" text-anchor="start" fill="#e08a6a" letter-spacing="1">land short</text>
    <text x="1220" y="866" font-size="17" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">lift widens the survivable corridor 3–5× vs a ballistic plunge</text>
  </g></svg>