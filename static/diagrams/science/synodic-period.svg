    <text x="80" y="88" font-size="28" text-anchor="start" fill="#7fb0e0" letter-spacing="1">SYNODIC PERIOD — THE LAUNCH-WINDOW CLOCK</text><text x="80" y="124" font-size="18" text-anchor="start" fill="#cfe3fb" letter-spacing="1">the target must lead by a set angle so it meets the transfer ellipse at arrival</text>
    <!-- Sun -->
    <circle cx="560" cy="500" r="26" fill="#ffd27f"/>
    <text x="560" y="556" font-size="14" text-anchor="middle" fill="#ffd27f" letter-spacing="1">SUN</text>
    <!-- Earth orbit (inner) + Mars orbit (outer) -->
    <circle cx="560" cy="500" r="150" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>
    <circle cx="560" cy="500" r="260" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>
    <text x="560" y="328" font-size="13" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">Earth orbit</text>
    <text x="560" y="228" font-size="13" text-anchor="middle" fill="#e08a6a" letter-spacing="1">Mars orbit</text>
    <!-- Earth at departure (bottom of inner) -->
    <circle cx="560" cy="650" r="10" fill="#4b9cd3"/> <text x="560" y="682" font-size="14" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">EARTH — departure</text>
    <!-- Mars at required lead angle ahead (~44 deg from departure radius) -->
    <circle cx="747" cy="686" r="10" fill="#e08a6a"/> <text x="770" y="700" font-size="14" text-anchor="start" fill="#e08a6a" letter-spacing="1">MARS at launch (leads by ≈ 44°)</text>
    <!-- arrival point (top of outer) -->
    <circle cx="560" cy="240" r="7" fill="#ffffff"/> <text x="560" y="210" font-size="13" text-anchor="middle" fill="#cfe3fb" letter-spacing="1">rendezvous — Mars arrives here</text>
    <!-- phase-angle wedge -->
    <path d="M 560 500 L 560 650 A 150 150 0 0 0 690 575 Z" fill="rgba(255,210,127,0.14)"/>
    <text x="645" y="640" font-size="12" text-anchor="start" fill="#ffd27f" letter-spacing="1">phase angle</text>
    <!-- transfer ellipse: Earth(bottom,inner) to arrival(top,outer) -->
    <path d="M 560 650 Q 980 500 560 240" fill="none" stroke="#cfe3fb" stroke-width="2.6" stroke-dasharray="9 7"/>
    <text x="880" y="500" font-size="14" text-anchor="start" fill="#cfe3fb" letter-spacing="1">transfer ellipse (~259 d)</text>
    <!-- formula block -->
    <text x="1120" y="760" font-size="22" text-anchor="start" fill="#ffd27f" letter-spacing="1">1/S = |1/T₁ − 1/T₂|</text>
    <text x="1120" y="800" font-size="16" text-anchor="start" fill="#cfe3fb" letter-spacing="1">Earth–Mars S ≈ 780 d (~26 mo)</text>
    <text x="810" y="872" font-size="16" text-anchor="middle" fill="#7fb0e0" letter-spacing="1">the alignment recurs every synodic period — which is why a launch window is periodic</text>
  </g></svg>