<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#0a0e18"/><g font-family="monospace" fill="#cfe3fb">
    <circle cx="539" cy="740" r="1.29" fill="rgba(255,255,255,0.59)"/><circle cx="1568" cy="176" r="0.41" fill="rgba(255,255,255,0.46)"/><circle cx="879" cy="537" r="0.66" fill="rgba(255,255,255,0.31)"/><circle cx="447" cy="785" r="0.74" fill="rgba(255,255,255,0.32)"/><circle cx="455" cy="670" r="0.58" fill="rgba(255,255,255,0.58)"/><circle cx="411" cy="671" r="1.17" fill="rgba(255,255,255,0.20)"/><circle cx="399" cy="554" r="0.94" fill="rgba(255,255,255,0.29)"/><circle cx="179" cy="634" r="1.03" fill="rgba(255,255,255,0.42)"/><circle cx="200" cy="209" r="1.30" fill="rgba(255,255,255,0.55)"/><circle cx="565" cy="540" r="1.42" fill="rgba(255,255,255,0.38)"/><circle cx="1145" cy="322" r="1.48" fill="rgba(255,255,255,0.34)"/><circle cx="585" cy="597" r="0.67" fill="rgba(255,255,255,0.52)"/><circle cx="401" cy="693" r="0.74" fill="rgba(255,255,255,0.16)"/><circle cx="1559" cy="214" r="0.59" fill="rgba(255,255,255,0.34)"/><circle cx="1265" cy="527" r="1.42" fill="rgba(255,255,255,0.20)"/><circle cx="501" cy="702" r="0.76" fill="rgba(255,255,255,0.53)"/><circle cx="81" cy="361" r="0.37" fill="rgba(255,255,255,0.15)"/><circle cx="1318" cy="74" r="0.44" fill="rgba(255,255,255,0.43)"/><circle cx="1120" cy="546" r="1.44" fill="rgba(255,255,255,0.64)"/><circle cx="564" cy="211" r="0.48" fill="rgba(255,255,255,0.50)"/><circle cx="130" cy="476" r="1.23" fill="rgba(255,255,255,0.30)"/><circle cx="1102" cy="133" r="0.98" fill="rgba(255,255,255,0.27)"/><circle cx="1057" cy="274" r="1.13" fill="rgba(255,255,255,0.31)"/><circle cx="1035" cy="344" r="1.29" fill="rgba(255,255,255,0.44)"/><circle cx="1224" cy="183" r="0.59" fill="rgba(255,255,255,0.57)"/><circle cx="1043" cy="684" r="1.20" fill="rgba(255,255,255,0.18)"/><circle cx="110" cy="433" r="0.61" fill="rgba(255,255,255,0.18)"/><circle cx="820" cy="691" r="1.47" fill="rgba(255,255,255,0.57)"/><circle cx="20" cy="167" r="1.40" fill="rgba(255,255,255,0.21)"/><circle cx="1551" cy="485" r="0.80" fill="rgba(255,255,255,0.58)"/><circle